<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spotify PKCE + Like (Authorization Code)</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#0f1113;color:#eee;padding:18px}
  .box{max-width:900px;margin:0 auto;background:#161618;padding:16px;border-radius:8px}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0}
  input{flex:1;padding:8px;border-radius:6px;background:#111;border:1px solid #222;color:#eee}
  button{padding:8px 12px;border-radius:6px;border:none;background:#1db954;color:#051;cursor:pointer}
  pre{background:#050506;padding:10px;border-radius:6px;overflow:auto;height:180px}
  .muted{color:#9aa;font-size:0.9rem}
  .note{color:#fbb}
</style>
</head>
<body>
  <div class="box">
    <h2>Spotify PKCE (response_type=code) — Test Like</h2>
    <p class="muted">Client ID intégré : <strong id="clientIdDisplay"></strong></p>
    <p class="muted">Redirect URI calculée : <code id="redirectUri"></code></p>

    <div class="row">
      <button id="authBtn">Se connecter (PKCE)</button>
      <button id="logoutBtn" style="background:#444;color:#fff">Déconnexion</button>
      <div style="margin-left:auto"><span id="status" class="muted">Non connecté</span></div>
    </div>

    <div class="row">
      <label style="width:100px">Track ID :</label>
      <input id="trackInput" placeholder="ex: 78FNSZkI1968KTtyf2s315" />
      <button id="checkBtn">Vérifier</button>
      <button id="toggleBtn">Basculer like</button>
    </div>

    <p class="muted note" id="warning"></p>

    <div class="row">
      <div style="flex:1">
        <p class="muted">Token / info :</p>
        <pre id="tokenInfo">Aucun token</pre>
      </div>
      <div style="flex:1;margin-left:8px">
        <p class="muted">API Log :</p>
        <pre id="apiLog">Rien pour l'instant</pre>
      </div>
    </div>
  </div>

<script>
/* CONFIG */
const CLIENT_ID = '91d4165085fd4ed3bd281f16667d64bc';
const REDIRECT_URI = window.location.origin + window.location.pathname; // doit être EXACTEMENT enregistré dans ton app Spotify
const SCOPE = 'user-read-currently-playing user-library-read user-library-modify';
const AUTH_ENDPOINT = 'https://accounts.spotify.com/authorize';
const TOKEN_ENDPOINT = 'https://accounts.spotify.com/api/token';

document.getElementById('clientIdDisplay').innerText = CLIENT_ID;
document.getElementById('redirectUri').innerText = REDIRECT_URI;

const statusEl = document.getElementById('status');
const tokenInfoEl = document.getElementById('tokenInfo');
const apiLogEl = document.getElementById('apiLog');
const warningEl = document.getElementById('warning');

function logApi(...args) {
  const t = new Date().toLocaleTimeString();
  apiLogEl.innerText = `[${t}] ${args.join(' ')}\n` + apiLogEl.innerText;
  console.log(...args);
}

function setTokenInfo(obj) {
  tokenInfoEl.innerText = JSON.stringify(obj, null, 2);
}

/* PKCE helpers */
function base64UrlEncode(buffer) {
  return btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function sha256(text) {
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return digest;
}

function genVerifier(len = 128) {
  const array = new Uint8Array(len);
  crypto.getRandomValues(array);
  return Array.from(array).map(b => ('0' + (b & 0xff).toString(16)).slice(-2)).join('');
}

async function genChallengeFromVerifier(v) {
  const d = await sha256(v);
  return base64UrlEncode(d);
}

/* Auth flow: redirect to /authorize?response_type=code */
async function startAuthPKCE() {
  warningEl.innerText = '';
  const verifier = genVerifier(64);
  localStorage.setItem('pkce_verifier', verifier);
  const challenge = await genChallengeFromVerifier(verifier);

  const params = new URLSearchParams({
    response_type: 'code',
    client_id: CLIENT_ID,
    scope: SCOPE,
    redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256',
    code_challenge: challenge,
    show_dialog: 'true'
  });
  window.location.href = AUTH_ENDPOINT + '?' + params.toString();
}

/* Exchange code -> token (client-side). Might be blocked by CORS in some environments. */
async function exchangeCodeForToken(code) {
  const verifier = localStorage.getItem('pkce_verifier');
  if (!verifier) throw new Error('PKCE verifier missing');

  const body = new URLSearchParams({
    grant_type: 'authorization_code',
    code: code,
    redirect_uri: REDIRECT_URI,
    client_id: CLIENT_ID,
    code_verifier: verifier
  });

  try {
    const resp = await fetch(TOKEN_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    });

    const text = await resp.text();
    logApi('POST /api/token ->', resp.status, text);
    if (!resp.ok) {
      // If CORS blocked, resp may not be ok or fetch may have thrown earlier.
      try { const json = JSON.parse(text); return { error: json }; } catch(e) { return { error: text }; }
    }
    const data = JSON.parse(text);
    // store token + expiry + scopes
    const now = Date.now();
    localStorage.setItem('sp_access_token', data.access_token);
    localStorage.setItem('sp_token_expiry', String(now + (data.expires_in || 3600) * 1000));
    if (data.scope) localStorage.setItem('sp_token_scopes', data.scope);
    setTokenInfo({ access_token: data.access_token.slice(0,8) + '…', scopes: data.scope, expires_in: data.expires_in });
    updateStatusConnected();
    return { data };
  } catch (err) {
    // network / CORS error
    logApi('Exchange failed (network/CORS):', String(err));
    return { error: String(err) };
  }
}

/* Token helpers */
function getStoredToken() {
  const t = localStorage.getItem('sp_access_token');
  const exp = Number(localStorage.getItem('sp_token_expiry') || 0);
  if (!t || Date.now() > exp) {
    localStorage.removeItem('sp_access_token');
    localStorage.removeItem('sp_token_expiry');
    localStorage.removeItem('sp_token_scopes');
    updateStatusDisconnected();
    return null;
  }
  return { access_token: t, scopes: localStorage.getItem('sp_token_scopes') || '' };
}

function updateStatusConnected() {
  statusEl.innerText = 'Connecté';
  statusEl.style.color = '#8f8';
}
function updateStatusDisconnected() {
  statusEl.innerText = 'Non connecté';
  statusEl.style.color = '#f88';
  setTokenInfo({});
}

/* API helper */
async function apiFetch(path, opts = {}) {
  const tok = getStoredToken();
  if (!tok) throw new Error('No token');
  const headers = Object.assign({}, opts.headers || {}, { Authorization: 'Bearer ' + tok.access_token });
  const res = await fetch('https://api.spotify.com' + path, Object.assign({}, opts, { headers }));
  return res;
}

/* Like operations */
async function checkIfTrackLiked(trackId) {
  try {
    const resp = await apiFetch(`/v1/me/tracks/contains?ids=${encodeURIComponent(trackId)}`);
    const text = await resp.text();
    logApi('GET contains ->', resp.status, text);
    if (!resp.ok) {
      if (resp.status === 401) { alert('401 token invalide. Reconnecte-toi.'); clearToken(); return null; }
      if (resp.status === 403) { alert('403 Forbidden — scope manquant (user-library-modify). Reconnecte-toi en acceptant le scope.'); return null; }
      return null;
    }
    const arr = JSON.parse(text);
    return !!arr[0];
  } catch (e) {
    logApi('checkIfTrackLiked error', e);
    return null;
  }
}

async function toggleLike(trackId) {
  const tok = getStoredToken();
  if (!tok) return alert('Connecte-toi d’abord');
  // check current UI state to pick method
  const currently = document.getElementById('likeEmoji')?.dataset.liked === 'true';
  const method = currently ? 'DELETE' : 'PUT';
  try {
    const resp = await fetch(`https://api.spotify.com/v1/me/tracks?ids=${encodeURIComponent(trackId)}`, {
      method,
      headers: { Authorization: 'Bearer ' + tok.access_token }
    });
    const text = await resp.text();
    logApi(`${method} /me/tracks ->`, resp.status, text || '(no body)');
    if (resp.ok || resp.status === 204) {
      const newState = !currently;
      document.getElementById('likeEmoji').textContent = newState ? '❤️' : '🤍';
      document.getElementById('likeEmoji').dataset.liked = String(newState);
      alert('Opération réussie.');
    } else {
      if (resp.status === 401) { alert('401 token invalide. Reconnecte-toi.'); clearToken(); }
      else if (resp.status === 403) { alert('403 Forbidden — scope manquant ou compte incorrect.'); }
      else alert('Erreur API: ' + resp.status);
    }
  } catch (e) {
    logApi('toggleLike network error', e);
    alert('Erreur réseau (voir console).');
  }
}

/* UI wiring */
document.getElementById('authBtn').addEventListener('click', startAuthPKCE);
document.getElementById('logoutBtn').addEventListener('click', () => { clearToken(); updateStatusDisconnected(); });
document.getElementById('checkBtn').addEventListener('click', async () => {
  const id = document.getElementById('trackInput').value.trim();
  if (!id) return alert('Saisis un track id');
  const r = await checkIfTrackLiked(id);
  if (r === null) return;
  document.getElementById('likeEmoji')?.remove();
  // update small UI
  if (!document.getElementById('likeEmoji')) {
    const img = document.createElement('span'); img.id = 'likeEmoji'; img.style.fontSize = '24px';
    document.querySelector('.row').appendChild(img);
  }
  document.getElementById('likeEmoji').textContent = r ? '❤️' : '🤍';
  document.getElementById('likeEmoji').dataset.liked = String(r);
});
document.getElementById('toggleBtn').addEventListener('click', async () => {
  const id = document.getElementById('trackInput').value.trim();
  if (!id) return alert('Saisis un track id');
  await toggleLike(id);
});

/* token storage utilities */
function clearToken() {
  localStorage.removeItem('sp_access_token');
  localStorage.removeItem('sp_token_expiry');
  localStorage.removeItem('sp_token_scopes');
  setTokenInfo({});
}

/* On load: if code present in query, exchange it */
(async function init() {
  updateStatusDisconnected();
  // if redirected back with ?code=..., exchange
  const qs = new URLSearchParams(window.location.search);
  const code = qs.get('code');
  if (code) {
    // remove code param from URL
    window.history.replaceState({}, document.title, window.location.pathname);
    setTokenInfo({ status: 'Exchange en cours...' });
    const result = await exchangeCodeForToken(code);
    if (result && result.data && result.data.access_token) {
      setTokenInfo({ access_token: result.data.access_token.slice(0,8) + '…', scopes: result.data.scope });
      updateStatusConnected();
      warningEl.innerText = '';
    } else {
      const err = result && result.error ? result.error : 'Unknown';
      setTokenInfo({ exchange_error: err });
      // if error looks like CORS/network, explain user must use a proxy
      if (String(err).toLowerCase().includes('failed to fetch') || String(err).toLowerCase().includes('cors')) {
        warningEl.innerText = 'Échange code→token bloqué par CORS : le navigateur ne peut pas appeler /api/token. Lance un petit proxy serveur ou utilise GitHub Pages + un serveur d’échange. Dis‑moi si tu veux le code du proxy (node/express).';
      } else {
        warningEl.innerText = 'Échec de l’échange de code. Voir tokenInfo pour le détail.';
      }
    }
  } else {
    // show stored token if exists
    const stored = getStoredToken();
    if (stored) {
      setTokenInfo({ access_token: stored.access_token.slice(0,8) + '…', scopes: stored.scopes });
      updateStatusConnected();
    } else {
      setTokenInfo({});
    }
  }
})();
</script>
</body>
</html>
