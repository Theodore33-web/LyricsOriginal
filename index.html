<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lyrics Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #121212; 
            color: white; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #1DB954; margin-bottom: 20px; }

        #login-btn { 
            background-color: #1DB954; color: white; border: none; 
            padding: 15px 30px; border-radius: 30px; font-weight: bold; 
            cursor: pointer; font-size: 16px;
        }

        /* Layout Principal */
        #dashboard { 
            display: none; 
            width: 100%;
            max-width: 1100px;
            gap: 20px;
            margin-top: 20px;
        }

        /* SECTION GAUCHE : PAROLES */
        .lyrics-section {
            flex: 2;
            background: #181818;
            padding: 30px;
            border-radius: 20px;
            min-height: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* SECTION DROITE : PROFIL + LECTEUR */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 300px;
        }

        .card {
            background: #282828;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Éléments spécifiques */
        #avatar { border-radius: 50%; width: 60px; border: 2px solid #1DB954; }
        #track-art { width: 100%; max-width: 200px; border-radius: 10px; margin: 15px 0; }
        
        .controls button { 
            background: none; border: none; color: white; 
            font-size: 25px; cursor: pointer; margin: 0 10px; 
        }
        .controls button:hover { color: #1DB954; }
        
        #lyrics-content {
            color: #b3b3b3;
            line-height: 1.6;
            font-size: 1.1em;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h1>Spotify Player</h1>
    
    <button id="login-btn">Se connecter avec Spotify</button>

    <div id="dashboard">
        <div class="lyrics-section">
            <h2 style="color: #1DB954; border-bottom: 1px solid #333; padding-bottom: 10px;">Paroles</h2>
            <div id="lyrics-content">
                Les paroles s'afficheront ici... 
                <br><br>
                <small>(Note : L'API Spotify ne permet pas l'accès direct aux paroles. Vous pouvez intégrer une API comme Musixmatch ou Genius ici).</small>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <img id="avatar" src="" alt="Profil">
                <h4 id="name" style="margin: 10px 0 0 0;">Utilisateur</h4>
                <p style="font-size: 11px; color: #1DB954; margin: 5px 0;">MEMBRE PREMIUM</p>
            </div>

            <div class="card">
                <p style="color: #1DB954; font-weight: bold; font-size: 0.9em;">LECTURE EN COURS</p>
                <img id="track-art" src="" alt="" style="display:none;">
                <h3 id="track-title" style="font-size: 1.2em; margin: 10px 0;">Ouvre Spotify</h3>
                <p id="track-artist" style="color: #b3b3b3; font-size: 0.9em; margin-bottom: 15px;"></p>
                
                <div class="controls">
                    <button onclick="previousTrack()">⏮</button>
                    <button id="play-pause-btn" onclick="togglePlay()">▶️</button>
                    <button onclick="nextTrack()">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const clientId = "91d4165085fd4ed3bd281f16667d64bc"; 
        const redirectUri = window.location.origin + window.location.pathname;
        let currentToken = "";

        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (!code) {
            document.getElementById('login-btn').onclick = () => redirectToSpotify();
        } else {
            document.getElementById('login-btn').style.display = 'none';
            handleCallback(code);
        }

        async function redirectToSpotify() {
            const verifier = generateCodeVerifier(128);
            const challenge = await generateCodeChallenge(verifier);
            localStorage.setItem("verifier", verifier);
            const scope = "user-read-private user-read-email user-modify-playback-state user-read-playback-state";
            const authUrl = new URL("https://accounts.spotify.com/authorize");
            const args = { response_type: 'code', client_id: clientId, scope: scope, redirect_uri: redirectUri, code_challenge_method: 'S256', code_challenge: challenge };
            authUrl.search = new URLSearchParams(args).toString();
            window.location.href = authUrl.toString();
        }

        async function handleCallback(code) {
            const verifier = localStorage.getItem("verifier");
            const body = new URLSearchParams({ client_id: clientId, grant_type: 'authorization_code', code: code, redirect_uri: redirectUri, code_verifier: verifier });
            const response = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
            const data = await response.json();
            if (data.access_token) getUserData(data.access_token);
        }

        async function getUserData(token) {
            currentToken = token;
            const response = await fetch('https://api.spotify.com/v1/me', { headers: { 'Authorization': 'Bearer ' + token } });
            const user = await response.json();
            document.getElementById('dashboard').style.display = 'flex';
            document.getElementById('name').innerText = user.display_name;
            document.getElementById('avatar').src = user.images[0]?.url || "https://via.placeholder.com/60";
            updateNowPlaying();
        }

        async function togglePlay() {
            const res = await fetch('https://api.spotify.com/v1/me/player', { headers: { 'Authorization': 'Bearer ' + currentToken } });
            if (res.status === 204) return alert("Lancez Spotify sur un appareil !");
            const playback = await res.json();
            const endpoint = playback.is_playing ? 'pause' : 'play';
            await fetch(`https://api.spotify.com/v1/me/player/$${endpoint}`, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + currentToken } });
            setTimeout(updateNowPlaying, 500);
        }

        async function nextTrack() {
            await fetch('https://api.spotify.com/v1/me/player/next', { method: 'POST', headers: { 'Authorization': 'Bearer ' + currentToken } });
            setTimeout(updateNowPlaying, 500);
        }

        async function previousTrack() {
            await fetch('https://api.spotify.com/v1/me/player/previous', { method: 'POST', headers: { 'Authorization': 'Bearer ' + currentToken } });
            setTimeout(updateNowPlaying, 500);
        }

        async function updateNowPlaying() {
            if (!currentToken) return;
            try {
                const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', { headers: { 'Authorization': 'Bearer ' + currentToken } });
                if (response.status === 204) {
                    document.getElementById('track-title').innerText = "Rien n'est diffusé";
                    document.getElementById('track-art').style.display = "none";
                    return;
                }
                const data = await response.json();
                if (data && data.item) {
                    document.getElementById('track-title').innerText = data.item.name;
                    document.getElementById('track-artist').innerText = data.item.artists.map(a => a.name).join(", ");
                    const art = document.getElementById('track-art');
                    art.src = data.item.album.images[0].url;
                    art.style.display = "inline-block";
                    document.getElementById('play-pause-btn').innerText = data.is_playing ? "⏸" : "▶️";
                }
            } catch (e) { console.error(e); }
        }

        function generateCodeVerifier(length) {
            let text = '';
            let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            const data = new TextEncoder().encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        setInterval(updateNowPlaying, 3000);
    </script>
</body>
</html>
