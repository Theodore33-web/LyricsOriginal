<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Original</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --bg-black: #121212;
            --card-grey: #181818;
            --light-grey: #282828;
            --text-grey: #b3b3b3;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-black); 
            color: white; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #login-section { text-align: center; margin-top: 100px; }
        #login-btn { 
            background-color: var(--spotify-green); color: white; border: none; 
            padding: 15px 40px; border-radius: 40px; font-weight: bold; 
            cursor: pointer; font-size: 18px; transition: transform 0.2s;
        }
        #login-btn:hover { transform: scale(1.05); }

        #dashboard { 
            display: none; 
            width: 100%;
            max-width: 1200px;
            gap: 20px;
            margin-top: 20px;
            flex-direction: row;
        }

        .lyrics-section {
            flex: 2;
            background: var(--card-grey);
            padding: 30px;
            border-radius: 20px;
            height: 75vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .lyrics-section::-webkit-scrollbar { width: 0px; }

        .lyric-line {
            font-size: 1.5rem;
            margin: 15px 0;
            color: var(--text-grey);
            transition: all 0.4s ease;
            opacity: 0.3;
        }
        .lyric-line.active {
            color: var(--spotify-green);
            opacity: 1;
            transform: scale(1.1);
            font-weight: bold;
        }

        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 300px;
        }

        .card {
            background: var(--light-grey);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #avatar { border-radius: 50%; width: 50px; border: 2px solid var(--spotify-green); height: 50px; object-fit: cover; }
        
        #track-art { 
            width: 150px; 
            height: 150px; 
            object-fit: cover; 
            border-radius: 12px; 
            margin: 10px auto; 
            display: block; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
        }
        
        .controls button { 
            background: none; border: none; color: white; 
            font-size: 30px; cursor: pointer; margin: 0 10px; 
        }
        .controls button:hover { color: var(--spotify-green); }
        
        #track-title { font-size: 1.2rem; margin: 10px 0 2px 0; }
        #track-artist { color: var(--text-grey); font-size: 0.9rem; margin-top: 0; }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .search-box input {
            flex: 1;
            background: #121212;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 8px 15px;
            color: white;
            outline: none;
        }
        .search-box input:focus { border-color: var(--spotify-green); }
        
        .search-box button {
            background: var(--spotify-green);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #mic-btn {
            background: #333;
            transition: background 0.3s, transform 0.2s;
        }
        #mic-btn.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #search-results {
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
        }
        .search-item {
            padding: 8px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-item:hover { background: #333; }
        .search-item img { width: 30px; height: 30px; border-radius: 4px; }

        @media (max-width: 768px) {
            #dashboard { flex-direction: column-reverse; }
            .sidebar { width: 100%; min-width: unset; }
            .lyrics-section { height: 50vh; padding: 20px; }
            .lyric-line { font-size: 1.2rem; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

    <div id="login-section">
        <h1 style="color: var(--spotify-green); font-size: 3rem; margin-bottom: 10px;">Lyrics Original</h1>
        <p style="color: var(--text-grey); margin-bottom: 30px;">Tes paroles synchronisées en un clic.</p>
        <button id="login-btn">Se connecter avec Spotify</button>
    </div>

    <div id="dashboard">
        <div class="lyrics-section" id="lyrics-container">
            <div id="lyrics-content">Lancez une musique sur Spotify...</div>
        </div>

        <div class="sidebar">
            <div class="card" style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                <img id="avatar" src="" alt="">
                <div style="text-align: left;">
                    <h4 id="name" style="margin: 0;">Chargement...</h4>
                    <span style="color: var(--spotify-green); font-size: 11px; font-weight: bold;">PREMIUM</span>
                </div>
            </div>

            <div class="card">
                <p style="color: var(--spotify-green); font-weight: bold; font-size: 0.8rem; margin: 0 0 10px 0; text-align: left;">RECHERCHER</p>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Titre, artiste...">
                    <button onclick="searchTrack()" title="Rechercher par texte">🔍</button>
                    <button id="mic-btn" onclick="toggleMicrophoneListen()" title="Identifier la musique ambiante">🎙️</button>
                </div>
                <div id="search-results"></div>
            </div>

            <div class="card">
                <p style="color: var(--spotify-green); font-weight: bold; font-size: 0.8rem; margin: 0;">LECTURE EN COURS</p>
                <img id="track-art" src="" alt="" style="display:none;">
                <h3 id="track-title">Aucune lecture</h3>
                <p id="track-artist"></p>
                
                <div class="controls">
                    <button onclick="previousTrack()">⏮</button>
                    <button id="play-pause-btn" onclick="togglePlay()">▶️</button>
                    <button onclick="nextTrack()">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const clientId = "91d4165085fd4ed3bd281f16667d64bc"; 
        const redirectUri = window.location.origin + window.location.pathname;
        let currentToken = "";
        let lastTrackId = "";
        let currentLyrics = [];

        // --- PARAMÈTRES ACRCLOUD NETTOYÉS (Erreur 3014 résolue) ---
        const acrAccessKey = "e5c443d8f0f15902b0641c6dec6f8999";
        const acrAccessSecret = "1xV0C2O2iYfuLqmfQURFbhdnhUxrtlztNnG6XxDz"; 
        const acrHost = "identify-eu-west-1.acrcloud.com";

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (code) {
            document.getElementById('login-section').style.display = 'none';
            handleCallback(code);
        } else {
            document.getElementById('login-btn').onclick = () => redirectToSpotify();
        }

        async function redirectToSpotify() {
            const verifier = generateCodeVerifier(128);
            const challenge = await generateCodeChallenge(verifier);
            localStorage.setItem("verifier", verifier);
            const scope = "user-read-private user-read-email user-modify-playback-state user-read-playback-state";
            const authUrl = new URL("https://accounts.spotify.com/authorize");
            const args = { response_type: 'code', client_id: clientId, scope: scope, redirect_uri: redirectUri, code_challenge_method: 'S256', code_challenge: challenge };
            authUrl.search = new URLSearchParams(args).toString();
            window.location.href = authUrl.toString();
        }

        async function handleCallback(code) {
            const verifier = localStorage.getItem("verifier");
            const body = new URLSearchParams({ client_id: clientId, grant_type: 'authorization_code', code: code, redirect_uri: redirectUri, code_verifier: verifier });
            
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
                const data = await response.json();
                if (data.access_token) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                    getUserData(data.access_token);
                }
            } catch (e) {
                console.error("Erreur d'authentification : ", e);
            }
        }

        async function getUserData(token) {
            currentToken = token;
            try {
                const response = await fetch('https://api.spotify.com/v1/me', { headers: { 'Authorization': 'Bearer ' + token } });
                const user = await response.json();
                document.getElementById('dashboard').style.display = 'flex';
                document.getElementById('name').innerText = user.display_name;
                document.getElementById('avatar').src = user.images && user.images.length > 0 ? user.images[0].url : "https://via.placeholder.com/50";
                updateNowPlaying();
            } catch (e) {
                console.error("Impossible de récupérer le profil : ", e);
            }
        }

        // --- ENREGISTREMENT AUDIO (Optimisé pour éviter l'Erreur 1001) ---
        async function toggleMicrophoneListen() {
            const micBtn = document.getElementById('mic-btn');
            const resultsContainer = document.getElementById('search-results');

            if (isRecording) {
                console.log("[MICRO] Arrêt manuel requis.");
                if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
                return;
            }

            try {
                console.log("[MICRO] Demande d'accès et configuration du flux...");
                // On force un taux d'échantillonnage idéal pour la reconnaissance vocale/musicale
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true
                    } 
                });
                
                audioChunks = [];
                let options = {};
                
                if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                    options = { mimeType: 'audio/webm;codecs=opus' };
                } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
                    options = { mimeType: 'audio/ogg;codecs=opus' };
                }
                
                console.log("[MICRO] Mode d'encodage retenu :", options.mimeType || "Standard");
                mediaRecorder = new MediaRecorder(stream, options);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstart = () => {
                    isRecording = true;
                    micBtn.classList.add('recording');
                    micBtn.innerText = "🛑";
                    resultsContainer.innerHTML = "<p style='font-size:0.9rem; color:var(--text-grey); margin:5px;'>Écoute en cours (8s)... Rapprochez la musique.</p>";
                };

                mediaRecorder.onstop = async () => {
                    isRecording = false;
                    micBtn.classList.remove('recording');
                    micBtn.innerText = "🎙️";
                    resultsContainer.innerHTML = "<p style='font-size:0.9rem; color:var(--text-grey); margin:5px;'>Analyse acoustique en cours...</p>";

                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    console.log("[MICRO] Flux d'échantillon clos. Poids transféré :", audioBlob.size, "octets");
                    
                    stream.getTracks().forEach(track => track.stop());

                    if(audioBlob.size > 1000) { // On s'assure que le fichier n'est pas vide
                        recognizeAudioWithACRCloud(audioBlob);
                    } else {
                        console.error("[ERREUR] Données audio insuffisantes ou absentes.");
                        resultsContainer.innerHTML = "<p style='font-size:0.9rem; color:red; margin:5px;'>Erreur : Capture audio vide (Vérifiez le HTTPS).</p>";
                    }
                };

                mediaRecorder.start();

                setTimeout(() => {
                    if (isRecording && mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                    }
                }, 8000);

            } catch (err) {
                console.error("[ERREUR ACQUISITION MICRO] :", err);
                resultsContainer.innerHTML = "<p style='font-size:0.9rem; color:red; margin:5px;'>Microphone déconnecté ou protocole non-sécurisé (HTTPS requis).</p>";
            }
        }

        // --- TRAITEMENT ET ENVOI À ACRCLOUD ---
        async function recognizeAudioWithACRCloud(blob) {
            const resultsContainer = document.getElementById('search-results');
            const currentTimestamp = Math.floor(Date.now() / 1000);
            
            const stringToSign = [
                'POST',
                '/v1/identify',
                acrAccessKey,
                'audio',
                '1',
                currentTimestamp
            ].join('\n');

            const signature = CryptoJS.HmacSHA1(stringToSign, acrAccessSecret).toString(CryptoJS.enc.Base64);

            const formData = new FormData();
            formData.append('sample', blob);
            formData.append('access_key', acrAccessKey);
            formData.append('data_type', 'audio');
            formData.append('signature_version', '1');
            formData.append('signature', signature);
            formData.append('timestamp', currentTimestamp);

            try {
                console.log("[ACRCLOUD] Transfert de l'empreinte au serveur...");
                const response = await fetch(`https://${acrHost}/v1/identify`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                console.log("[ACRCLOUD] RÉPONSE SERVEUR :", result);

                if (result.status && result.status.code === 0 && result.metadata && result.metadata.music) {
                    resultsContainer.innerHTML = "";
                    
                    result.metadata.music.forEach(track => {
                        const item = document.createElement('div');
                        item.className = 'search-item';
                        
                        let spotifyUri = null;
                        if (track.external_metadata && track.external_metadata.spotify) {
                            const spotifyTrackId = track.external_metadata.spotify.track.id;
                            spotifyUri = `spotify:track:${spotifyTrackId}`;
                        }

                        item.innerHTML = `
                            <div style="background:#1DB954; width:30px; height:30px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:12px;">🎧</div>
                            <div>
                                <strong style="display:block; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${track.title}</strong>
                                <span style="font-size: 0.8rem; color: var(--text-grey);">${track.artists[0].name}</span>
                            </div>
                        `;
                        
                        item.onclick = () => {
                            if (spotifyUri) {
                                playTrack(spotifyUri);
                            } else {
                                document.getElementById('search-input').value = `${track.title} ${track.artists[0].name}`;
                                searchTrack();
                            }
                        };
                        resultsContainer.appendChild(item);
                    });
                } else {
                    const errCode = result.status ? result.status.code : "Inconnu";
                    const errText = result.status ? result.status.msg : "Erreur";
                    console.warn(`[ACRCLOUD] Code retourné : ${errCode} (${errText})`);
                    resultsContainer.innerHTML = `<p style='font-size:0.85rem; color:var(--text-grey); margin:5px;'>Non reconnu (Code: ${errCode}). Montez le son ou rapprochez le micro.</p>`;
                }

            } catch (err) {
                console.error("[ACRCLOUD ERREUR RÉSEAU] :", err);
                resultsContainer.innerHTML = "<p style='font-size:0.9rem; color:red; margin:5px;'>Erreur réseau serveur.</p>";
            }
        }

        // --- COMMANDES ET INTERFACE SPOTIFY (Syntaxes $ obligatoires corrigées) ---
        async function searchTrack() {
            const query = document.getElementById('search-input').value;
            if (!query || !currentToken) return;

            try {
                const response = await fetch(`https://api.spotify.com/v1/search?q=$${encodeURIComponent(query)}&type=track&limit=5`, {
                    headers: { 'Authorization': 'Bearer ' + currentToken }
                });
                const data = await response.json();
                const resultsContainer = document.getElementById('search-results');
                resultsContainer.innerHTML = "";

                if (data.tracks && data.tracks.items.length > 0) {
                    data.tracks.items.forEach(track => {
                        const item = document.createElement('div');
                        item.className = 'search-item';
                        item.innerHTML = `
                            <img src="${track.album.images && track.album.images.length > 2 ? track.album.images[2].url : 'https://via.placeholder.com/30'}" alt="">
                            <div>
                                <strong style="display:block; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${track.name}</strong>
                                <span style="font-size: 0.8rem; color: var(--text-grey);">${track.artists[0].name}</span>
                            </div>
                        `;
                        item.onclick = () => playTrack(track.uri);
                        resultsContainer.appendChild(item);
                    });
                } else {
                    resultsContainer.innerHTML = "<p style='font-size:0.9rem; color:var(--text-grey); margin:5px;'>Aucun résultat trouvé sur Spotify.</p>";
                }
            } catch (e) { console.error(e); }
        }

        async function playTrack(trackUri) {
            try {
                const response = await fetch('https://api.spotify.com/v1/me/player/play', {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + currentToken, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uris: [trackUri] })
                });
                if (response.status === 204) {
                    document.getElementById('search-results').innerHTML = "";
                    document.getElementById('search-input').value = "";
                    setTimeout(updateNowPlaying, 600);
                } else if (response.status === 404) {
                    alert("Aucun lecteur actif détecté. Assurez-vous d'ouvrir l'application Spotify sur l'un de vos appareils.");
                }
            } catch (e) { console.error(e); }
        }

        document.getElementById('search-input')?.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchTrack();
        });

        // --- GESTIONNAIRE DES PAROLES (LRCLIB) ---
        async function fetchLyrics(artist, title, album, duration) {
            try {
                const url = `https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}&album_name=${encodeURIComponent(album)}&duration=${Math.round(duration)}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.syncedLyrics) {
                    parseLyrics(data.syncedLyrics);
                } else {
                    document.getElementById('lyrics-content').innerText = data.plainLyrics || "Paroles introuvables.";
                    currentLyrics = [];
                }
            } catch (e) {
                document.getElementById('lyrics-content').innerText = "Erreur de chargement des paroles.";
            }
        }

        function parseLyrics(lrc) {
            const lines = lrc.split('\n');
            currentLyrics = lines.map(line => {
                const match = line.match(/\[(\d+):(\d+\.\d+)\](.*)/);
                if (match) {
                    return { time: parseInt(match[1]) * 60 + parseFloat(match[2]), text: match[3].trim() };
                }
                return null;
            }).filter(l => l && l.text !== "");
            document.getElementById('lyrics-content').innerHTML = currentLyrics.map((l, i) => `<div id="line-${i}" class="lyric-line">${l.text}</div>`).join('');
        }

        function highlightLyrics(currentTime) {
            currentLyrics.forEach((line, i) => {
                const el = document.getElementById(`line-${i}`);
                if (!el) return;
                const next = currentLyrics[i+1];
                if (currentTime >= line.time && (!next || currentTime < next.time)) {
                    if (!el.classList.contains('active')) {
                        document.querySelectorAll('.lyric-line').forEach(l => l.classList.remove('active'));
                        el.classList.add('active');
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            });
        }

        // --- SYNCHRONISATION CONTINU ---
        async function updateNowPlaying() {
            if (!currentToken) return;
            try {
                const response = await fetch('https://api.spotify.com/v1/me/player', { headers: { 'Authorization': 'Bearer ' + currentToken } });
                if (response.status === 204 || response.status === 401) return;
                const data = await response.json();

                if (data && data.item) {
                    document.getElementById('track-title').innerText = data.item.name;
                    document.getElementById('track-artist').innerText = data.item.artists.map(a => a.name).join(", ");
                    const art = document.getElementById('track-art');
                    art.src = data.item.album.images && data.item.album.images.length > 0 ? data.item.album.images[0].url : ""; 
                    art.style.display = "block";
                    document.getElementById('play-pause-btn').innerText = data.is_playing ? "⏸" : "▶️";

                    highlightLyrics(data.progress_ms / 1000);

                    if (data.item.id !== lastTrackId) {
                        lastTrackId = data.item.id;
                        fetchLyrics(data.item.artists[0].name, data.item.name, data.item.album.name, data.item.duration_ms / 1000);
                    }
                }
            } catch (e) {}
        }

        async function togglePlay() {
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player', { headers: { 'Authorization': 'Bearer ' + currentToken } });
                if (res.status === 204) return alert("Lancez l'application Spotify sur l'un de vos appareils !");
                const playback = await res.json();
                const endpoint = playback.is_playing ? 'pause' : 'play';
                await fetch(`https://api.spotify.com/v1/me/player/$${endpoint}`, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + currentToken } });
                setTimeout(updateNowPlaying, 500);
            } catch (e) {}
        }

        async function nextTrack() { await fetch('https://api.spotify.com/v1/me/player/next', { method: 'POST', headers: { 'Authorization': 'Bearer ' + currentToken } }); setTimeout(updateNowPlaying, 500); }
        async function previousTrack() { await fetch('https://api.spotify.com/v1/me/player/previous', { method: 'POST', headers: { 'Authorization': 'Bearer ' + currentToken } }); setTimeout(updateNowPlaying, 500); }

        function generateCodeVerifier(l) { let t = ''; let p = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; for (let i = 0; i < l; i++) t += p.charAt(Math.floor(Math.random() * p.length)); return t; }
        async function generateCodeChallenge(v) { const d = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)); return btoa(String.fromCharCode.apply(null, new Uint8Array(d))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

        setInterval(updateNowPlaying, 1000);
    </script>
</body>
</html>
