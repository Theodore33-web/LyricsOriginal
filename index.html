<script>
        const clientId = '91d4165085fd4ed3bd281f16667d64bc';
        const redirectUri = 'https://theodore33-web.github.io/LyricsOriginal/';
        const scope = 'playlist-read-private playlist-read-collaborative user-modify-playback-state';

        let currentToken = null; 

        const loginBtn = document.getElementById('login-btn');
        const statusText = document.getElementById('status-text');
        const volumeBox = document.getElementById('volume-box');
        const volumeSlider = document.getElementById('volume-slider');

        // --- ENCODAGE & CRYPTO POUR PKCE ---
        function generateCodeVerifier(length) {
            let text = '';
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
            for (let i = 0; i < length; i++) {
                text += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            const base64String = btoa(String.fromCharCode(...new Uint8Array(digest)));
            return base64String.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        // --- AUTHENTIFICATION ---
        async function redirectToSpotify() {
            const verifier = generateCodeVerifier(128);
            localStorage.setItem("verifier", verifier);
            const challenge = await generateCodeChallenge(verifier);

            const authUrl = new URL("https://accounts.spotify.com/authorize");
            const args = {
                response_type: 'code',
                client_id: clientId,
                scope: scope,
                redirect_uri: redirectUri,
                code_challenge_method: 'S256',
                code_challenge: challenge
            };
            authUrl.search = new URLSearchParams(args).toString();
            window.location.href = authUrl.toString();
        }

        async function getAccessToken(code) {
            const codeVerifier = localStorage.getItem('verifier');
            const payload = {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: redirectUri,
                    code_verifier: codeVerifier
                })
            };
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', payload);
                const data = await response.json();
                return data.access_token;
            } catch (error) {
                console.error("Erreur token:", error);
                statusText.textContent = "Erreur d'authentification.";
            }
        }

        // --- CORRECTION DU VOLUME ---
        async function setSpotifyVolume(volumePercent, token) {
            try {
                // Syntaxe JavaScript corrigée ${volumePercent} et ajout du paramètre requis ?volume_percent=
                await fetch(`https://api.spotify.com/v1/me/player/volume?volume_percent=${volumePercent}`, {
                    method: 'PUT', 
                    headers: { 'Authorization': `Bearer ${token}` }
                });
            } catch (error) {
                console.error("Erreur lors de l'ajustement du volume:", error);
            }
        }

        // --- RÉCUPÉRATION DES DONNÉES ---
        async function fetchPlaylists(token) {
            statusText.textContent = "Chargement des playlists...";
            try {
                const response = await fetch('https://api.spotify.com/v1/me/playlists', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                displayPlaylists(data.items, token);
                statusText.textContent = "Connecté à Spotify.";
                
                // Affichage du bloc volume une fois connecté
                volumeBox.style.display = 'flex';
            } catch (error) {
                statusText.textContent = "Erreur de chargement des playlists.";
            }
        }

        async function fetchPlaylistTracks(playlistId, token) {
            statusText.textContent = "Chargement des titres...";
            try {
                // Syntaxe JavaScript corrigée ${playlistId} et utilisation de /items
                const response = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/items`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                displayTracks(data.items);
                statusText.textContent = "Titres chargés.";
            } catch (error) {
                console.error("Erreur titres:", error);
                statusText.textContent = "Erreur de chargement des titres.";
            }
        }

        // --- AFFICHAGE DOM ---
        function displayPlaylists(playlists, token) {
            const container = document.getElementById('playlists');
            container.innerHTML = '';
            if (!playlists || playlists.length === 0) {
                container.innerHTML = '<li>Aucune playlist trouvée</li>';
                return;
            }
            playlists.forEach(pl => {
                if (pl) {
                    const li = document.createElement('li');
                    
                    if (pl.images && pl.images.length > 0) {
                        const img = document.createElement('img');
                        img.src = pl.images[0].url;
                        img.alt = "Couverture";
                        img.style.width = '40px';
                        img.style.height = '40px';
                        img.style.borderRadius = '4px';
                        img.style.objectFit = 'cover';
                        li.appendChild(img);
                    }

                    const textNode = document.createElement('span');
                    textNode.textContent = pl.name;
                    li.appendChild(textNode);
                    
                    li.addEventListener('click', () => fetchPlaylistTracks(pl.id, token));
                    container.appendChild(li);
                }
            });
        }

        function displayTracks(items) {
            const container = document.getElementById('tracks');
            container.innerHTML = '';

            if (!items || items.length === 0) {
                container.innerHTML = '<li>Cette playlist est vide</li>';
                return;
            }

            items.forEach(playlistItem => {
                const itemData = playlistItem.item || playlistItem.track; 
                
                if (itemData) {
                    const li = document.createElement('li');

                    let imageUrl = '';
                    if (itemData.album && itemData.album.images && itemData.album.images.length > 0) {
                        imageUrl = itemData.album.images[0].url;
                    }

                    if (imageUrl) {
                        const img = document.createElement('img');
                        img.src = imageUrl;
                        img.alt = "Pochette";
                        img.style.width = '40px';
                        img.style.height = '40px';
                        img.style.borderRadius = '4px';
                        img.style.objectFit = 'cover';
                        li.appendChild(img);
                    }

                    const textNode = document.createElement('span');
                    const artistsNames = itemData.artists && itemData.artists.length > 0 
                        ? itemData.artists.map(a => a.name).join(', ') 
                        : 'Artiste inconnu';
                        
                    textNode.textContent = `${itemData.name || 'Titre inconnu'} - ${artistsNames}`;
                    li.appendChild(textNode);
                    container.appendChild(li);
                }
            });
        }

        // --- INITIALISATION ---
        loginBtn.addEventListener('click', redirectToSpotify);

        // Déclencheur lors du changement de valeur de la barre de volume
        volumeSlider.addEventListener('change', (e) => {
            if (currentToken) {
                setSpotifyVolume(e.target.value, currentToken);
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                loginBtn.style.display = 'none';
                window.history.pushState({}, document.title, window.location.pathname);
                const token = await getAccessToken(code);
                if (token) {
                    currentToken = token; 
                    fetchPlaylists(token);
                }
            }
        });
    </script>
