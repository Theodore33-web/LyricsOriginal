<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Spotify Lyrics Player</title>

  <style>
    body {
      background: #121212;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      background: #1db954;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    #lyrics {
      margin-top: 30px;
      max-height: 300px;
      overflow-y: auto;
      font-size: 18px;
    }

    .line {
      opacity: 0.4;
      transition: 0.3s;
    }

    .active {
      color: #1db954;
      font-size: 22px;
      opacity: 1;
    }
  </style>
</head>

<body>

<h1 id="title">Spotify Lyrics</h1>

<button onclick="login()">Se connecter à Spotify</button>

<div id="lyrics"></div>

<script src="app.js"></script>

</body>
</html>
