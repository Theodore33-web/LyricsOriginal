<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Original - Bibliothèque & AudD</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --bg-black: #121212;
            --card-grey: rgba(24, 24, 24, 0.75);
            --light-grey: rgba(40, 40, 40, 0.75);
            --text-grey: #b3b3b3;
            --gradient-color-1: #134e5e;
            --gradient-color-2: #71b280;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-black);
            color: white; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: padding 0.5s ease;
        }

        .background-aurora {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 1;
            background: radial-gradient(circle at 30% 30%, var(--gradient-color-1) 0%, transparent 40%),
                        radial-gradient(circle at 70% 60%, var(--gradient-color-2) 0%, transparent 45%),
                        radial-gradient(circle at 50% 40%, #121212 0%, #121212 100%);
            filter: blur(140px); 
            animation: rotateAurora 20s linear infinite;
            transition: all 2s ease-in-out;
            pointer-events: none;
        }

        @keyframes rotateAurora {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        #login-section { text-align: center; margin-top: 100px; position: relative; z-index: 2; }
        #login-btn { 
            background-color: var(--spotify-green); color: white; border: none; 
            padding: 15px 40px; border-radius: 40px; font-weight: bold; 
            cursor: pointer; font-size: 18px; transition: transform 0.2s;
        }
        #login-btn:hover { transform: scale(1.05); }

        #dashboard { 
            display: none; 
            width: 100%;
            max-width: 1200px;
            gap: 20px;
            margin-top: 20px;
            flex-direction: row;
            position: relative;
            z-index: 2;
            transition: all 0.5s ease;
        }

        /* Mode Cinéma Plein Écran */
        body.cinema-mode { padding: 0; }
        body.cinema-mode .sidebar { display: none !important; }
        body.cinema-mode .lyrics-section { 
            flex: 1; 
            height: 90vh; 
            margin-top: 5vh;
            background: transparent; 
            border: none; 
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        body.cinema-mode .cinema-btn { color: var(--spotify-green); }

        .lyrics-section {
            flex: 2;
            background: var(--card-grey);
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            padding: 30px;
            border-radius: 20px;
            height: 75vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            transition: all 0.5s ease;
        }
        .lyrics-section::-webkit-scrollbar { width: 0px; }

        .cinema-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s, color 0.2s;
        }
        .cinema-btn:hover { transform: scale(1.1); color: var(--spotify-green); }

        /* Animation Crossfade Fluide pour les Paroles */
        .lyric-line {
            font-size: 1.6rem;
            margin: 20px 0;
            color: var(--text-grey);
            transition: color 0.6s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease, filter 0.6s ease;
            opacity: 0.2;
            filter: blur(2px);
            transform: scale(0.95);
        }
        .lyric-line.active {
            color: #ffffff;
            opacity: 1;
            filter: blur(0px);
            transform: scale(1.08);
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 300px;
            transition: all 0.5s ease;
        }

        .card {
            background: var(--light-grey);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #avatar { border-radius: 50%; width: 50px; border: 2px solid var(--spotify-green); height: 50px; object-fit: cover; }
        
        #track-art { 
            width: 150px; 
            height: 150px; 
            object-fit: cover; 
            border-radius: 12px; 
            margin: 10px auto; 
            display: block; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
        }
        
        .controls button { 
            background: none; border: none; color: white; 
            font-size: 30px; cursor: pointer; margin: 0 10px; 
        }
        .controls button:hover { color: var(--spotify-green); }
        
        #track-title { font-size: 1.2rem; margin: 10px 0 2px 0; }
        #track-artist { color: var(--text-grey); font-size: 0.9rem; margin-top: 0; }

        /* Structure Barre de Progression Interactive */
        .progress-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 15px 5px 5px 5px;
            font-size: 0.75rem;
            color: var(--text-grey);
        }
        .progress-bar-bg {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--spotify-green);
            border-radius: 3px;
            transition: width 0.3s linear;
        }
        .progress-bar-bg:hover .progress-bar-fill { background: #1ed760; }

        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            align-items: center;
        }
        .search-box input {
            flex: 1;
            max-width: 150px;
            background: #121212;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 8px 12px;
            color: white;
            outline: none;
            font-size: 0.85rem;
        }
        .search-box input:focus { border-color: var(--spotify-green); }
        
        .search-box button {
            background: var(--spotify-green); color: white; border: none; border-radius: 50%;
            width: 34px; height: 34px; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        
        #mic-btn { background: #333; transition: background 0.3s, transform 0.2s; }
        #mic-btn.recording { background: #ef4444; animation: pulse 1.5s infinite; }

        #lib-toggle-btn { background: transparent; border: 1px solid var(--spotify-green); color: var(--spotify-green); font-size: 1rem; transition: all 0.2s; }
        #lib-toggle-btn:hover { background: var(--spotify-green); color: white; }

        .lib-btn { background: none; border: 1px solid var(--spotify-green); color: var(--spotify-green); border-radius: 20px; padding: 8px 15px; margin-top: 5px; cursor: pointer; font-size: 0.8rem; font-weight: bold; width: 100%; transition: all 0.2s; }
        .lib-btn:hover { background: var(--spotify-green); color: white; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        #search-results { max-height: 200px; overflow-y: auto; text-align: left; margin-top: 10px; }
        #search-results::-webkit-scrollbar { width: 4px; }
        #search-results::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .search-item { padding: 8px; cursor: pointer; border-radius: 8px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
        .search-item:hover { background: #333; }
        .search-item img { width: 30px; height: 30px; border-radius: 4px; object-fit: cover; }

        @media (max-width: 768px) {
            #dashboard { flex-direction: column-reverse; }
            .sidebar { width: 100%; min-width: unset; }
            .lyrics-section { height: 50vh; padding: 20px; }
            .lyric-line { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="background-aurora" id="bg-aurora"></div>

    <div id="login-section">
        <h1 style="color: var(--spotify-green); font-size: 3rem; margin-bottom: 10px;">Lyrics Original</h1>
        <p style="color: var(--text-grey); margin-bottom: 30px;">Vos paroles synchronisées et votre bibliothèque réunies.</p>
        <button id="login-btn">Se connecter avec Spotify</button>
    </div>

    <div id="dashboard">
        <div class="lyrics-section" id="lyrics-container">
            <button class="cinema-btn" onclick="toggleCinemaMode()" title="Mode Karaoké Plein Écran">⛶</button>
            <div id="lyrics-content">Lancez une musique sur Spotify...</div>
        </div>

        <div class="sidebar">
            <div class="card" style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                <img id="avatar" src="" alt="">
                <div style="text-align: left;">
                    <h4 id="name" style="margin: 0;">Chargement...</h4>
                    <span style="color: var(--spotify-green); font-size: 11px; font-weight: bold;">PREMIUM</span>
                </div>
            </div>

            <div class="card">
                <p style="color: var(--spotify-green); font-weight: bold; font-size: 0.8rem; margin: 0 0 10px 0; text-align: left;">EXPLORER & RECHERCHER</p>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Titre, artiste...">
                    <button onclick="searchTrack()" title="Rechercher par texte">🔍</button>
                    <button id="mic-btn" onclick="toggleMicrophoneListen()" title="Identifier via AudD">🎙️</button>
                    <button id="lib-toggle-btn" onclick="getUserLibrary()" title="Ouvrir ma bibliothèque (Likés)">📂</button>
                </div>
                <div id="search-results"></div>
            </div>

            <div class="card">
                <p style="color: var(--spotify-green); font-weight: bold; font-size: 0.8rem; margin: 0;">LECTURE EN COURS</p>
                <img id="track-art" src="" alt="" style="display:none;" crossorigin="anonymous">
                <h3 id="track-title">Aucune lecture</h3>
                <p id="track-artist"></p>
                
                <div class="progress-container">
                    <span id="time-current">0:00</span>
                    <div class="progress-bar-bg" onclick="seekTrack(event)">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <span id="time-max">0:00</span>
                </div>

                <div class="controls">
                    <button onclick="previousTrack()">⏮</button>
                    <button id="play-pause-btn" onclick="togglePlay()">▶️</button>
                    <button onclick="nextTrack()">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const clientId = "91d4165085fd4ed3bd281f16667d64bc"; 
        const redirectUri = window.location.origin + window.location.pathname;
        let currentToken = "";
        let lastTrackId = "";
        let currentLyrics = [];
        let trackDurationMs = 0;

        let libraryItems = [];
        let displayedCount = 10;

        const auddApiToken = "187ef3238849ff75583d237fa40dbb48"; 

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (code) {
            document.getElementById('login-section').style.display = 'none';
            handleCallback(code);
        } else {
            document.getElementById('login-btn').onclick = () => redirectToSpotify();
        }

        function toggleCinemaMode() {
            document.body.classList.toggle('cinema-mode');
        }

        async function redirectToSpotify() {
            const verifier = generateCodeVerifier(128);
            const challenge = await generateCodeChallenge(verifier);
            localStorage.setItem("verifier", verifier);
            const scope = "user-read-private user-read-email user-modify-playback-state user-read-playback-state user-library-read playlist-read-private";
            const authUrl = new URL("https://accounts.spotify.com/authorize");
            const args = { response_type: 'code', client_id: clientId, scope: scope, redirect_uri: redirectUri, code_challenge_method: 'S256', code_challenge: challenge };
            authUrl.search = new URLSearchParams(args).toString();
            window.location.href = authUrl.toString();
        }

        async function handleCallback(code) {
            const verifier = localStorage.getItem("verifier");
            const body = new URLSearchParams({ client_id: clientId, grant_type: 'authorization_code', code: code, redirect_uri: redirectUri, code_verifier: verifier });
            
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
                const data = await response.json();
                if (data.access_token) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                    getUserData(data.access_token);
                }
            } catch (e) { console.error(e); }
        }

        async function getUserData(token) {
            currentToken = token;
            try {
                const response = await fetch('https://api.spotify.com/v1/me', { headers: { 'Authorization': 'Bearer ' + token } });
                const user = await response.json();
                document.getElementById('dashboard').style.display = 'flex';
                document.getElementById('name').innerText = user.display_name;
                document.getElementById('avatar').src = user.images && user.images.length > 0 ? user.images[0].url : "https://via.placeholder.com/50";
                updateNowPlaying();
            } catch (e) { console.error(e); }
        }

        async function getUserLibrary() {
            if (!currentToken) return;
            const resultsContainer = document.getElementById('search-results');
            resultsContainer.innerHTML = "<p style='font-size:0.85rem; color:var(--text-grey); margin:5px;'>Chargement...</p>";
            try {
                const response = await fetch('https://api.spotify.com/v1/me/tracks?limit=50', { headers: { 'Authorization': 'Bearer ' + currentToken } });
                const data = await response.json();
                resultsContainer.innerHTML = "";
                if (data.items && data.items.length > 0) {
                    libraryItems = data.items; displayedCount = 10; renderLibrarySection();
                }
            } catch (e) { console.error(e); }
        }

        function renderLibrarySection() {
            const resultsContainer = document.getElementById('search-results');
            resultsContainer.innerHTML = "";
            const titleHeader = document.createElement('p');
            titleHeader.style = "color: var(--spotify-green); font-weight: bold; font-size: 0.8rem; margin: 5px 0 10px 5px;";
            titleHeader.innerText = "VOS TITRES LIKÉS";
            resultsContainer.appendChild(titleHeader);

            libraryItems.slice(0, displayedCount).forEach(obj => {
                const track = obj.track;
                const item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `
                    <img src="${track.album.images && track.album.images.length > 2 ? track.album.images[2].url : 'https://via.placeholder.com/30'}" alt="">
                    <div><strong>${track.name}</strong><br><span style="font-size:0.8rem;color:var(--text-grey);">${track.artists[0].name}</span></div>
                `;
                item.onclick = () => playTrack(track.uri);
                resultsContainer.appendChild(item);
            });
        }

        async function toggleMicrophoneListen() {
            const micBtn = document.getElementById('mic-btn');
            const resultsContainer = document.getElementById('search-results');
            if (isRecording) { if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = []; mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstart = () => { isRecording = true; micBtn.classList.add('recording'); micBtn.innerText = "🛑"; };
                mediaRecorder.onstop = async () => {
                    isRecording = false; micBtn.classList.remove('recording'); micBtn.innerText = "🎙️";
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    stream.getTracks().forEach(t => t.stop());
                    recognizeAudioWithAudD(audioBlob);
                };
                mediaRecorder.start(); setTimeout(() => { if (isRecording) mediaRecorder.stop(); }, 10000);
            } catch (err) { resultsContainer.innerHTML = "<p style='color:red;'>Microphone bloqué.</p>"; }
        }

        async function recognizeAudioWithAudD(blob) {
            const formData = new FormData(); formData.append('file', blob); formData.append('api_token', auddApiToken); formData.append('return', 'spotify');
            try {
                const response = await fetch('https://api.audd.io/', { method: 'POST', body: formData });
                const result = await response.json();
                if (result.status === "success" && result.result) {
                    const track = result.result;
                    let spotifyUri = track.spotify?.id ? `spotify:track:${track.spotify.id}` : null;
                    if (spotifyUri) playTrack(spotifyUri);
                }
            } catch (err) {}
        }

        async function searchTrack() {
            const query = document.getElementById('search-input').value;
            if (!query || !currentToken) return;
            try {
                const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=5`, { headers: { 'Authorization': 'Bearer ' + currentToken } });
                const data = await response.json();
                const resultsContainer = document.getElementById('search-results');
                resultsContainer.innerHTML = "";
                data.tracks.items.forEach(track => {
                    const item = document.createElement('div'); item.className = 'search-item';
                    item.innerHTML = `<img src="${track.album.images[2]?.url || ''}"><div><strong>${track.name}</strong><br><span>${track.artists[0].name}</span></div>`;
                    item.onclick = () => playTrack(track.uri); resultsContainer.appendChild(item);
                });
            } catch (e) { console.error(e); }
        }

        async function playTrack(trackUri) {
            try {
                await fetch('https://api.spotify.com/v1/me/player/play', { method: 'PUT', headers: { 'Authorization': 'Bearer ' + currentToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ uris: [trackUri] }) });
                setTimeout(updateNowPlaying, 600);
            } catch (e) {}
        }

        /* FONCTION DE NAVIGATION DANS LA MUSIQUE (SEEK) */
        async function seekTrack(event) {
            if (!currentToken || !trackDurationMs) return;
            const rect = event.currentTarget.getBoundingClientRect();
            const clickPositionRatio = (event.clientX - rect.left) / rect.width;
            const targetPositionMs = Math.floor(clickPositionRatio * trackDurationMs);

            try {
                await fetch(`https://api.spotify.com/v1/me/player/currently-playing{targetPositionMs}`, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + currentToken }
                });
                updateNowPlaying();
            } catch (e) { console.error("Erreur de navigation :", e); }
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        async function fetchLyrics(artist, title, album, duration) {
            try {
                const url = `https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}&album_name=${encodeURIComponent(album)}&duration=${Math.round(duration)}`;
                const response = await fetch(url); const data = await response.json();
                if (data.syncedLyrics) parseLyrics(data.syncedLyrics);
                else { document.getElementById('lyrics-content').innerText = data.plainLyrics || "Paroles indisponibles."; currentLyrics = []; }
            } catch (e) { document.getElementById('lyrics-content').innerText = "Erreur paroles."; }
        }

        function parseLyrics(lrc) {
            const lines = lrc.split('\n');
            currentLyrics = lines.map(line => {
                const match = line.match(/\[(\d+):(\d+\.\d+)\](.*)/);
                if (match) return { time: parseInt(match[1]) * 60 + parseFloat(match[2]), text: match[3].trim() };
                return null;
            }).filter(l => l && l.text !== "");
            document.getElementById('lyrics-content').innerHTML = currentLyrics.map((l, i) => `<div id="line-${i}" class="lyric-line">${l.text}</div>`).join('');
        }

        function highlightLyrics(currentTime) {
            currentLyrics.forEach((line, i) => {
                const el = document.getElementById(`line-${i}`);
                if (!el) return;
                const next = currentLyrics[i+1];
                if (currentTime >= line.time && (!next || currentTime < next.time)) {
                    if (!el.classList.contains('active')) {
                        document.querySelectorAll('.lyric-line').forEach(l => l.classList.remove('active'));
                        el.classList.add('active');
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            });
        }

        function updateDynamicBackground() {
            const img = document.getElementById('track-art');
            if (!img || img.style.display === "none" || !img.src) return;
            const tempImg = new Image(); tempImg.crossOrigin = "Anonymous"; tempImg.src = img.src;
            tempImg.onload = function() {
                try {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    canvas.width = 10; canvas.height = 10; ctx.drawImage(tempImg, 0, 0, 10, 10);
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                    let r1 = imgData[0], g1 = imgData[1], b1 = imgData[2];
                    let r2 = imgData[40], g2 = imgData[41], b2 = imgData[42];
                    if ((r1 + g1 + b1) < 100) { r1 += 60; g1 += 40; b1 += 90; }
                    if ((r2 + g2 + b2) < 100) { r2 += 90; g2 += 50; b2 += 40; }
                    document.documentElement.style.setProperty('--gradient-color-1', `rgb(${r1}, ${g1}, ${b1})`);
                    document.documentElement.style.setProperty('--gradient-color-2', `rgb(${r2}, ${g2}, ${b2})`);
                } catch (e) {}
            };
        }

        async function updateNowPlaying() {
            if (!currentToken) return;
            try {
                const response = await fetch('https://api.spotify.com/v1/me/player', { headers: { 'Authorization': 'Bearer ' + currentToken } });
                if (response.status === 204 || response.status === 401) return;
                const data = await response.json();

                if (data && data.item) {
                    trackDurationMs = data.item.duration_ms;
                    document.getElementById('track-title').innerText = data.item.name;
                    document.getElementById('track-artist').innerText = data.item.artists.map(a => a.name).join(", ");
                    
                    // Mise à jour de la barre de progression temporelle
                    document.getElementById('time-current').innerText = formatTime(data.progress_ms);
                    document.getElementById('time-max').innerText = formatTime(trackDurationMs);
                    const progressPercent = (data.progress_ms / trackDurationMs) * 100;
                    document.getElementById('progress-fill').style.width = `${progressPercent}%`;

                    const art = document.getElementById('track-art');
                    const oldSrc = art.src;
                    art.src = data.item.album.images?.[0]?.url || ""; 
                    art.style.display = "block";
                    document.getElementById('play-pause-btn').innerText = data.is_playing ? "⏸" : "▶️";

                    highlightLyrics(data.progress_ms / 1000);

                    if (art.src !== oldSrc) { art.onload = () => updateDynamicBackground(); }
                    if (data.item.id !== lastTrackId) {
                        lastTrackId = data.item.id;
                        fetchLyrics(data.item.artists[0].name, data.item.name, data.item.album.name, trackDurationMs / 1000);
                    }
                }
            } catch (e) {}
        }

        async function togglePlay() {
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player', { headers: { 'Authorization': 'Bearer ' + currentToken } });
                const playback = await res.json();
                const endpoint = playback.is_playing ? 'pause' : 'play';
                await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + currentToken } });
                setTimeout(updateNowPlaying, 300);
            } catch (e) {}
        }

        async function nextTrack() { 
            try { await fetch('https://api.spotify.com/v1/me/player/next', { method: 'POST', headers: { 'Authorization': 'Bearer ' + currentToken } }); setTimeout(updateNowPlaying, 500); } catch (e) {}
        }
        async function previousTrack() { 
            try { await fetch('https://api.spotify.com/v1/me/player/previous', { method: 'POST', headers: { 'Authorization': 'Bearer ' + currentToken } }); setTimeout(updateNowPlaying, 500); } catch (e) {}
        }

        function generateCodeVerifier(l) { let t = ''; let p = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; for (let i = 0; i < l; i++) t += p.charAt(Math.floor(Math.random() * p.length)); return t; }
        async function generateCodeChallenge(v) { const d = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)); return btoa(String.fromCharCode.apply(null, new Uint8Array(d))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

        document.getElementById('search-input')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchTrack(); });
        setInterval(updateNowPlaying, 1000);
    </script>
</body>
