<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Spotify GitHub</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 50px; background-color: #121212; color: white; }
        button { background-color: #1DB954; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background-color: #1ed760; }
        #profile { margin-top: 30px; display: none; }
        #avatar { border-radius: 50%; width: 100px; border: 3px solid #1DB954; margin-bottom: 10px; }
        #track-art { width: 150px; border-radius: 8px; margin-top: 10px; }
        .controls { margin: 20px 0; }
    </style>
</head>
<body>

    <h1>Mon Lecteur Spotify</h1>
    
    <button id="login-btn">Se connecter avec Spotify</button>

    <div id="profile">
        <img id="avatar" src="" alt="Photo de profil">
        <h2 id="name"></h2>
        
        <div class="controls">
            <button onclick="previousTrack()">⏮️</button>
            <button id="play-pause-btn" onclick="togglePlay()">⏸️ Pause</button>
            <button onclick="nextTrack()">⏭️</button>
        </div>

        <div id="now-playing" style="border-top: 1px solid #333; padding-top: 20px;">
            <p style="color: #1DB954; font-weight: bold; margin-bottom: 5px;">En cours d'écoute :</p>
            <img id="track-art" src="" alt="" style="display:none;">
            <h3 id="track-title" style="margin: 10px 0 5px 0;">Aucune musique</h3>
            <p id="track-artist" style="color: #b3b3b3; margin: 0;"></p>
        </div>
    </div>

    <script>
        const clientId = "91d4165085fd4ed3bd281f16667d64bc"; 
        const redirectUri = window.location.origin + window.location.pathname;
        let currentToken = "";

        // --- AUTHENTIFICATION ---
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (!code) {
            document.getElementById('login-btn').onclick = () => redirectToSpotify();
        } else {
            document.getElementById('login-btn').style.display = 'none';
            handleCallback(code);
        }

        async function redirectToSpotify() {
            const verifier = generateCodeVerifier(128);
            const challenge = await generateCodeChallenge(verifier);
            localStorage.setItem("verifier", verifier);

            const scope = "user-read-private user-read-email user-modify-playback-state user-read-playback-state";
            const authUrl = new URL("https://accounts.spotify.com/authorize");

            const args = {
                response_type: 'code',
                client_id: clientId,
                scope: scope,
                redirect_uri: redirectUri,
                code_challenge_method: 'S256',
                code_challenge: challenge
            };

            authUrl.search = new URLSearchParams(args).toString();
            window.location.href = authUrl.toString();
        }

        async function handleCallback(code) {
            const verifier = localStorage.getItem("verifier");
            const body = new URLSearchParams({
                client_id: clientId,
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: redirectUri,
                code_verifier: verifier
            });

            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });

            const data = await response.json();
            if (data.access_token) {
                getUserData(data.access_token);
            }
        }

        async function getUserData(token) {
            currentToken = token;
            const response = await fetch('https://api.spotify.com/v1/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const user = await response.json();
            
            document.getElementById('profile').style.display = 'block';
            document.getElementById('name').innerText = user.display_name;
            document.getElementById('avatar').src = user.images[0]?.url || "";
            
            updateNowPlaying();
        }

        // --- CONTRÔLES DU LECTEUR ---
        async function nextTrack() {
            await fetch('https://api.spotify.com/v1/me/player/next', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + currentToken }
            });
            setTimeout(updateNowPlaying, 500);
        }

        async function previousTrack() {
            await fetch('https://api.spotify.com/v1/me/player/previous', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + currentToken }
            });
            setTimeout(updateNowPlaying, 500);
        }

        async function togglePlay() {
            const res = await fetch('https://api.spotify.com/v1/me/player', {
                headers: { 'Authorization': 'Bearer ' + currentToken }
            });
            
            if (res.status === 204) return alert("Ouvrez Spotify sur un appareil !");
            
            const playback = await res.json();
            const endpoint = playback.is_playing ? 'pause' : 'play';
            
            await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + currentToken }
            });
            
            setTimeout(updateNowPlaying, 500);
        }

        async function updateNowPlaying() {
            if (!currentToken) return;

            try {
                const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                    headers: { 'Authorization': 'Bearer ' + currentToken }
                });

                if (response.status === 204) {
                    document.getElementById('track-title').innerText = "Rien n'est diffusé";
                    document.getElementById('track-art').style.display = "none";
                    return;
                }

                const data = await response.json();
                if (data && data.item) {
                    document.getElementById('track-title').innerText = data.item.name;
                    document.getElementById('track-artist').innerText = data.item.artists.map(a => a.name).join(", ");
                    const art = document.getElementById('track-art');
                    art.src = data.item.album.images[0].url;
                    art.style.display = "inline-block";
                    document.getElementById('play-pause-btn').innerText = data.is_playing ? "⏸️ Pause" : "▶️ Play";
                }
            } catch (e) { console.error(e); }
        }

        // --- UTILS ---
        function generateCodeVerifier(length) {
            let text = '';
            let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                text += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            const data = new TextEncoder().encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        setInterval(updateNowPlaying, 3000);
    </script>
</body>
</html>
