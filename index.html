<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Spotify Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: white; 
            padding: 20px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 30px; color: #1DB954; }

        /* Bouton de connexion au centre au début */
        #login-btn { 
            background-color: #1DB954; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 30px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
            transition: transform 0.2s;
        }
        #login-btn:hover { transform: scale(1.05); background-color: #1ed760; }

        /* Conteneur principal (Dashboard) */
        #profile { 
            display: none; /* Changé en 'flex' via JS après connexion */
            width: 100%;
            max-width: 1000px;
            flex-direction: row; 
            justify-content: space-between; 
            align-items: flex-start; 
            gap: 20px;
            margin-top: 20px;
        }

        /* Section Lecteur (Gauche) */
        .player-section {
            flex: 2;
            background: #181818;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Section Utilisateur (Droite) */
        .user-section {
            flex: 1;
            background: #282828;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            min-width: 200px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #avatar { border-radius: 50%; width: 80px; border: 2px solid #1DB954; margin-bottom: 10px; }
        #track-art { width: 250px; border-radius: 10px; margin: 20px 0; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        
        .controls button { 
            background: none; 
            border: none; 
            color: white; 
            font-size: 30px; 
            cursor: pointer; 
            margin: 0 15px; 
            transition: color 0.2s;
        }
        .controls button:hover { color: #1DB954; }
        #play-pause-btn { font-size: 45px; }

        #track-title { margin: 10px 0 5px 0; font-size: 1.5em; }
        #track-artist { color: #b3b3b3; margin: 0; font-size: 1.1em; }
    </style>
</head>
<body>

    <h1>Spotify Player</h1>
    
    <button id="login-btn">Se connecter avec Spotify</button>

    <div id="profile">
        <div class="player-section">
            <div id="now-playing">
                <p style="color: #1DB954; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">En cours d'écoute</p>
                <img id="track-art" src="" alt="Album Art" style="display:none;">
                <h3 id="track-title">Ouvre Spotify pour commencer</h3>
                <p id="track-artist"></p>
            </div>

            <div class="controls">
                <button onclick="previousTrack()">⏮</button>
                <button id="play-pause-btn" onclick="togglePlay()">▶️</button>
                <button onclick="nextTrack()">⏭</button>
            </div>
        </div>

        <div class="user-section">
            <img id="avatar" src="" alt="Profil">
            <h4 id="name" style="margin: 5px 0;">Chargement...</h4>
            <p style="font-size: 12px; color: #1DB954; font-weight: bold;">PREMIUM</p>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const clientId = "91d4165085fd4ed3bd281f16667d64bc"; 
        const redirectUri = window.location.origin + window.location.pathname;
        let currentToken = "";

        // --- AUTHENTIFICATION PKCE ---
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (!code) {
            document.getElementById('login-btn').onclick = () => redirectToSpotify();
        } else {
            document.getElementById('login-btn').style.display = 'none';
            handleCallback(code);
        }

        async function redirectToSpotify() {
            const verifier = generateCodeVerifier(128);
            const challenge = await generateCodeChallenge(verifier);
            localStorage.setItem("verifier", verifier);

            const scope = "user-read-private user-read-email user-modify-playback-state user-read-playback-state";
            const authUrl = new URL("https://accounts.spotify.com/authorize");

            const args = {
                response_type: 'code',
                client_id: clientId,
                scope: scope,
                redirect_uri: redirectUri,
                code_challenge_method: 'S256',
                code_challenge: challenge
            };

            authUrl.search = new URLSearchParams(args).toString();
            window.location.href = authUrl.toString();
        }

        async function handleCallback(code) {
            const verifier = localStorage.getItem("verifier");
            const body = new URLSearchParams({
                client_id: clientId,
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: redirectUri,
                code_verifier: verifier
            });

            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });

            const data = await response.json();
            if (data.access_token) {
                getUserData(data.access_token);
            }
        }

        async function getUserData(token) {
            currentToken = token;
            const response = await fetch('https://api.spotify.com/v1/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const user = await response.json();
            
            // On affiche le dashboard en mode FLEX
            document.getElementById('profile').style.display = 'flex';
            document.getElementById('name').innerText = user.display_name;
            document.getElementById('avatar').src = user.images[0]?.url || "https://via.placeholder.com/80";
            
            updateNowPlaying();
        }

        // --- CONTRÔLES ---
        async function nextTrack() {
            await fetch('https://api.spotify.com/v1/me/player/next', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + currentToken }
            });
            setTimeout(updateNowPlaying, 500);
        }

        async function previousTrack() {
            await fetch('https://api.spotify.com/v1/me/player/previous', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + currentToken }
            });
            setTimeout(updateNowPlaying, 500);
        }

        async function togglePlay() {
            const res = await fetch('https://api.spotify.com/v1/me/player', {
                headers: { 'Authorization': 'Bearer ' + currentToken }
            });
            
            if (res.status === 204) return alert("Lancez Spotify sur un appareil !");
            
            const playback = await res.json();
            const endpoint = playback.is_playing ? 'pause' : 'play';
            
            await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + currentToken }
            });
            
            setTimeout(updateNowPlaying, 500);
        }

        async function updateNowPlaying() {
            if (!currentToken) return;

            try {
                const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                    headers: { 'Authorization': 'Bearer ' + currentToken }
                });

                if (response.status === 204) {
                    document.getElementById('track-title').innerText = "Rien n'est diffusé";
                    document.getElementById('track-art').style.display = "none";
                    document.getElementById('track-artist').innerText = "";
                    return;
                }

                const data = await response.json();
                if (data && data.item) {
                    document.getElementById('track-title').innerText = data.item.name;
                    document.getElementById('track-artist').innerText = data.item.artists.map(a => a.name).join(", ");
                    const art = document.getElementById('track-art');
                    art.src = data.item.album.images[0].url;
                    art.style.display = "inline-block";
                    document.getElementById('play-pause-btn').innerText = data.is_playing ? "⏸" : "▶️";
                }
            } catch (e) { console.error("Erreur update:", e); }
        }

        // --- UTILS CRYPTO ---
        function generateCodeVerifier(length) {
            let text = '';
            let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                text += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            const data = new TextEncoder().encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        // Rafraîchir l'affichage toutes les 3 secondes
        setInterval(updateNowPlaying, 3000);
    </script>
</body>
</html>
