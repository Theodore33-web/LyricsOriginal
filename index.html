<!doctype html>
<html>
<head><meta charset="utf-8"><title>Spotify auth test (simple)</title></head>
<body>
  <h3>Test simple d'autorisation Spotify</h3>
  <p>Client ID: <strong>91d4165085fd4ed3bd281f16667d64bc</strong></p>
  <p>Redirect URI calculée (copier exactement dans le Dashboard Spotify) :</p>
  <pre id="redirect"></pre>
  <p>Si le lien ne s'ouvre pas, copie l'URL ci‑dessous et colle la dans la barre d'adresse.</p>
  <p><a id="authLink" href="#" target="_self">Lien d'autorisation Spotify (cliquez ici)</a></p>
  <p id="note" style="color:darkred"></p>

<script>
const CLIENT_ID = '91d4165085fd4ed3bd281f16667d64bc';
const REDIRECT = window.location.origin + window.location.pathname;
const SCOPE = 'user-read-private user-read-email user-library-read user-library-modify';
const AUTH = 'https://accounts.spotify.com/authorize';
document.getElementById('redirect').innerText = REDIRECT;

const params = new URLSearchParams({
  response_type: 'token',
  client_id: CLIENT_ID,
  scope: SCOPE,
  redirect_uri: REDIRECT,
  show_dialog: 'true'
});
const url = AUTH + '?' + params.toString();
const a = document.getElementById('authLink');
a.href = url;
a.innerText = url;
document.getElementById('note').innerText = 'Si tu n\'as pas ajouté EXACTEMENT ce redirect URI dans ton app Spotify, tu obtiendras une erreur "redirect_uri_mismatch".';
</script>
</body>
</html>
