<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LyricsOriginal - Spotify Connection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            padding: 20px;
        }
        button {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1ed760;
        }
        .container {
            display: flex;
            gap: 40px;
            margin-top: 20px;
        }
        .list-container {
            flex: 1;
            background: #181818;
            padding: 15px;
            border-radius: 8px;
        }
        li {
            list-style: none;
            padding: 10px;
            margin: 5px 0;
            background: #282828;
            border-radius: 4px;
            cursor: pointer;
        }
        li:hover {
            background: #3e3e3e;
        }
    </style>
</head>
<body>

    <h1>LyricsOriginal</h1>
    <button id="login-btn">Se connecter à Spotify</button>

    <div class="container">
        <div class="list-container">
            <h2>Mes Playlists</h2>
            <ul id="playlists"></ul>
        </div>
        <div class="list-container">
            <h2>Titres de la Playlist</h2>
            <ul id="tracks"></ul>
        </div>
    </div>

    <script>
        // Configuration Spotify
        const CLIENT_ID = '91d4165085fd4ed3bd281f16667d64bc';
        const REDIRECT_URI = 'https://theodore33-web.github.io/LyricsOriginal/';
        const SCOPES = 'playlist-read-private playlist-read-collaborative';

        const loginBtn = document.getElementById('login-btn');
        const playlistsUrl = 'https://api.spotify.com/v1/me/playlists';

        // 1. Redirection vers la page de connexion Spotify
        loginBtn.addEventListener('click', () => {
            const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}&response_type=token&show_dialog=true`;
            window.location.href = authUrl;
        });

        // 2. Récupération du Token d'accès depuis l'URL après redirection
        function getAccessTokenFromUrl() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return params.get('access_token');
        }

        const accessToken = getAccessTokenFromUrl();

        if (accessToken) {
            // Masquer le bouton de connexion si connecté
            loginBtn.style.display = 'none';
            // Nettoyer l'URL pour cacher le token
            window.history.pushState({}, document.title, window.location.pathname);
            
            // Charger les playlists
            fetchPlaylists(accessToken);
        }

        // 3. Récupérer les playlists de l'utilisateur
        async function fetchPlaylists(token) {
            try {
                const response = await fetch(playlistsUrl, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                displayPlaylists(data.items, token);
            } catch (error) {
                console.error('Erreur lors de la récupération des playlists:', error);
            }
        }

        // 4. Afficher les playlists dans le DOM
        function displayPlaylists(playlists, token) {
            const playlistsContainer = document.getElementById('playlists');
            playlistsContainer.innerHTML = '';

            playlists.forEach(playlist => {
                const li = document.createElement('li');
                li.textContent = playlist.name;
                // Événement au clic pour charger les titres
                li.addEventListener('click', () => fetchPlaylistTracks(playlist.id, token));
                playlistsContainer.appendChild(li);
            });
        }

        // 5. Récupérer les titres d'une playlist spécifique
        async function fetchPlaylistTracks(playlistId, token) {
            const tracksUrl = `https://api.spotify.com/v1/playlists/${playlistId}/tracks`;
            try {
                const response = await fetch(tracksUrl, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                displayTracks(data.items);
            } catch (error) {
                console.error('Erreur lors de la récupération des titres:', error);
            }
        }

        // 6. Afficher les titres dans le DOM
        function displayTracks(tracks) {
            const tracksContainer = document.getElementById('tracks');
            tracksContainer.innerHTML = '';

            tracks.forEach(item => {
                if (item.track) {
                    const li = document.createElement('li');
                    const artists = item.track.artists.map(artist => artist.name).join(', ');
                    li.textContent = `${item.track.name} - ${artists}`;
                    tracksContainer.appendChild(li);
                }
            });
        }
    </script>
</body>
</html>
