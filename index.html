<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Test "J'aime" Spotify (PKCE + proxy)</title>
<style>
  body{font-family:system-ui,Roboto,Arial;background:#0f1113;color:#eee;padding:18px}
  button{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;background:#1db954;color:#051}
  #likeBtn{font-size:22px;padding:8px 12px;background:#222;color:#fff;border:1px solid #444}
  #log{margin-top:12px;background:#070707;padding:10px;border-radius:6px;height:220px;overflow:auto;font-family:monospace;color:#9fd}
  .row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .small{font-size:0.9rem;color:#9aa}
</style>
</head>
<body>
  <h2>Test bouton "J'aime" (PKCE + proxy)</h2>
  <p class="small">Client ID: <code id="clientId">91d4165085fd4ed3bd281f16667d64bc</code></p>

  <div class="row">
    <button id="loginBtn">Se connecter avec Spotify</button>
    <button id="logoutBtn" style="background:#444;color:#fff">Se déconnecter</button>
    <span style="margin-left:auto" id="authStatus" class="small">non connecté</span>
  </div>

  <label style="display:block;margin-top:12px">Track ID :</label>
  <input id="trackInput" type="text" placeholder="ex: 78FNSZkI1968KTtyf2s315" style="width:100%;padding:8px;border-radius:6px;background:#121212;color:#eee;border:1px solid #333"/>

  <div class="row">
    <button id="checkBtn">Vérifier</button>
    <button id="toggleBtn">Basculer like</button>
    <button id="whoamiBtn">Vérifier token (/me)</button>
    <div style="margin-left:auto"><button id="resetBtn" style="background:#666">Reset</button></div>
  </div>

  <div class="row" style="margin-top:12px">
    <button id="likeBtn">🤍</button>
    <div id="statusText" class="small">inactif</div>
  </div>

  <div id="log"></div>

<script>
const CLIENT_ID = '91d4165085fd4ed3bd281f16667d64bc';
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPE = 'user-read-private user-read-email user-modify-playback-state user-read-playback-state user-library-read user-library-modify playlist-read-private user-read-recently-played user-read-currently-playing';
const PROXY_EXCHANGE = 'http://localhost:3000/exchange'; // point du proxy Node

function log(...args){ const t=new Date().toLocaleTimeString(); document.getElementById('log').innerText=`[${t}] ${args.map(a=>typeof a==='object'?JSON.stringify(a):a).join(' ')}\n`+document.getElementById('log').innerText; console.log(...args); }

function base64UrlEncode(buffer){ let str=String.fromCharCode.apply(null,new Uint8Array(buffer)); return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
async function generateCodeChallenge(verifier){ const data=new TextEncoder().encode(verifier); const digest=await window.crypto.subtle.digest('SHA-256',data); return base64UrlEncode(digest); }
function generateCodeVerifier(){ const array=new Uint8Array(96); crypto.getRandomValues(array); return Array.from(array).map(b=>('0'+(b&0xff).toString(16)).slice(-2)).join(''); }

async function startAuth(){
  const verifier = generateCodeVerifier();
  localStorage.setItem('pkce_verifier', verifier);
  const challenge = await generateCodeChallenge(verifier);
  const params = new URLSearchParams({
    response_type:'code',
    client_id:CLIENT_ID,
    scope:SCOPE,
    redirect_uri:REDIRECT_URI,
    code_challenge_method:'S256',
    code_challenge:challenge,
    show_dialog:'true'
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}

async function handleCallback(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const err = params.get('error');
  if (err){ log('Auth error param:', err); return; }
  if (!code) return;
  log('Auth code reçu', code);
  const verifier = localStorage.getItem('pkce_verifier');
  if (!verifier){ log('pkce_verifier absent'); return; }

  // Utilisation du proxy pour l'échange (évite CORS)
  try {
    const resp = await fetch(PROXY_EXCHANGE, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ code, redirect_uri: REDIRECT_URI, code_verifier: verifier })
    });
    const text = await resp.text();
    log('/exchange status', resp.status, text);
    if (!resp.ok){ return; }
    const data = JSON.parse(text);
    if (data.access_token){
      localStorage.setItem('spotify_access_token', data.access_token);
      if (data.scope) localStorage.setItem('spotify_scopes', data.scope);
      window.history.replaceState({}, document.title, REDIRECT_URI);
      updateAuthUI();
    } else {
      log('Aucun access_token dans la réponse', data);
    }
  } catch (e) {
    log('Erreur fetch /exchange (proxy) :', e);
  }
}

function getToken(){ return localStorage.getItem('spotify_access_token'); }
function clearToken(){ localStorage.removeItem('spotify_access_token'); localStorage.removeItem('spotify_scopes'); localStorage.removeItem('pkce_verifier'); updateAuthUI(); }

function updateAuthUI(){
  const token = getToken();
  const s = document.getElementById('authStatus');
  s.innerText = token ? 'connecté' : 'non connecté';
  s.style.color = token ? '#8f8' : '#f88';
  log('scopes (stockés):', localStorage.getItem('spotify_scopes') || '(aucun)');
}

async function whoami(){
  const token = getToken(); if(!token){ alert('Connecte-toi d\'abord'); return; }
  const r = await fetch('https://api.spotify.com/v1/me', { headers:{ Authorization: 'Bearer ' + token }});
  const text = await r.text();
  log('/me ->', r.status, text);
  document.getElementById('statusText').innerText = r.ok ? 'token valide' : '/me -> ' + r.status;
}

async function checkIfTrackIsLiked(){
  const token = getToken(); const track = document.getElementById('trackInput').value.trim();
  if(!token){ alert('Connecte-toi'); return; } if(!track){ alert('Saisis un track id'); return; }
  const r = await fetch(`https://api.spotify.com/v1/me/tracks/contains?ids=${encodeURIComponent(track)}`, { headers:{ Authorization:'Bearer '+token }});
  const text = await r.text();
  log('GET contains ->', r.status, text);
  if(!r.ok){ document.getElementById('statusText').innerText = 'Erreur ' + r.status; return; }
  const arr = JSON.parse(text); const isLiked = !!arr[0];
  document.getElementById('likeBtn').innerText = isLiked ? '❤️' : '🤍';
  document.getElementById('likeBtn').dataset.liked = String(isLiked);
  document.getElementById('statusText').innerText = isLiked ? 'Déjà liké' : 'Pas liké';
}

async function toggleLike(){
  const token = getToken(); const track = document.getElementById('trackInput').value.trim();
  if(!token){ alert('Connecte-toi'); return; } if(!track){ alert('Saisis un track id'); return; }
  const likeBtn = document.getElementById('likeBtn'); const currently = likeBtn.dataset.liked === 'true';
  const method = currently ? 'DELETE' : 'PUT';
  const r = await fetch(`https://api.spotify.com/v1/me/tracks?ids=${encodeURIComponent(track)}`, { method, headers:{ Authorization:'Bearer '+token }});
  const body = await r.text();
  log(`${method} /me/tracks ->`, r.status, body || '(no body)');
  if(!r.ok){ if(r.status===401){ alert('token invalide'); } else if(r.status===403){ alert('403 Forbidden — scope manquant ou compte incorrect'); } document.getElementById('statusText').innerText = 'Erreur ' + r.status; return; }
  const newState = !currently; likeBtn.innerText = newState ? '❤️' : '🤍'; likeBtn.dataset.liked = String(newState); document.getElementById('statusText').innerText = newState ? 'Liké' : 'Non liké';
  await checkIfTrackIsLiked();
}

/* wiring */
document.getElementById('loginBtn').addEventListener('click', startAuth);
document.getElementById('logoutBtn').addEventListener('click', clearToken);
document.getElementById('whoamiBtn').addEventListener('click', whoami);
document.getElementById('checkBtn').addEventListener('click', checkIfTrackIsLiked);
document.getElementById('toggleBtn').addEventListener('click', toggleLike);
document.getElementById('resetBtn').addEventListener('click', ()=>{ document.getElementById('trackInput').value=''; document.getElementById('likeBtn').innerText='🤍'; delete document.getElementById('likeBtn').dataset.liked; document.getElementById('statusText').innerText='inactif'; log('Reset'); });
document.getElementById('likeBtn').addEventListener('click', toggleLike);

/* on load */
updateAuthUI();
handleCallback();
</script>
</body>
</html>
