<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LyricsOriginal — Like current track (Spotify PKCE)</title>
<style>
  body{font-family:system-ui,Segoe UI,Arial;background:#0f1113;color:#eee;padding:18px;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .card{width:760px;background:#161618;padding:20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
  h1{color:#1DB954;margin:0 0 12px}
  .layout{display:flex;gap:20px}
  .left{flex:1;text-align:center;padding:18px;border-right:1px solid #242424}
  .track-art{width:180px;height:180px;margin:12px auto;border-radius:8px;background:#222;background-size:cover;background-position:center}
  .title{font-weight:700;margin-top:10px}
  .artist{color:#b3b3b3;margin-bottom:8px}
  .like{font-size:42px;background:none;border:none;color:inherit;cursor:pointer}
  .disabled{opacity:.5;pointer-events:none}
  .right{width:320px;padding:8px}
  .section-title{color:#1DB954;margin-bottom:8px}
  .list{max-height:300px;overflow:auto;padding:0;margin:0;list-style:none}
  .item{display:flex;gap:10px;padding:8px;border-radius:6px;align-items:center}
  .item img{width:44px;height:44px;border-radius:4px;object-fit:cover}
  .small{font-size:13px;color:#9aa}
  .status{margin-top:12px;color:#1DB954;font-style:italic;text-align:center}
  pre{background:#0b0b0b;padding:8px;border-radius:6px;color:#9fd;max-height:120px;overflow:auto}
  .controls{display:flex;gap:8px;justify-content:center;margin-top:10px}
  button.primary{background:#1DB954;border:none;padding:8px 12px;border-radius:8px;color:#051;cursor:pointer}
  button.ghost{background:#333;border:none;padding:8px 12px;border-radius:8px;color:#fff;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <h1>LyricsOriginal — Like current track</h1>
    <div class="layout">
      <div class="left">
        <div id="auth-area">
          <button id="auth-btn" class="primary">Se connecter à Spotify</button>
          <button id="logout-btn" class="ghost">Déconnexion</button>
          <div class="small" id="scopes-info"></div>
        </div>
        <div class="track-art" id="track-art" style="display:none"></div>
        <div class="title" id="track-title">Aucun titre</div>
        <div class="artist" id="track-artist">—</div>

        <div class="controls">
          <button id="like-btn" class="like" title="Like / Unlike" aria-label="Like" disabled>🤍</button>
        </div>

        <div class="status" id="status">Statut : non connecté</div>
      </div>

      <div class="right">
        <div class="section-title">Mes titres likés (extrait)</div>
        <ul id="saved-list" class="list"></ul>
        <div style="margin-top:10px" class="small">Logs & debug :</div>
        <pre id="log">—</pre>
      </div>
    </div>
  </div>

<script>
/* ====== CONFIG - reuse your start ====== */
const CLIENT_ID = '91d4165085fd4ed3bd281f16667d64bc';
const REDIRECT_URI = window.location.origin + window.location.pathname; // ensure this exact URI is registered in Spotify Dashboard
const SCOPES = 'user-read-currently-playing user-library-read user-library-modify';
const AUTH_ENDPOINT = 'https://accounts.spotify.com/authorize';
const TOKEN_ENDPOINT = 'https://accounts.spotify.com/api/token';

/* ====== UI elements ====== */
const authBtn = document.getElementById('auth-btn');
const logoutBtn = document.getElementById('logout-btn');
const statusEl = document.getElementById('status');
const trackArtEl = document.getElementById('track-art');
const trackTitleEl = document.getElementById('track-title');
const trackArtistEl = document.getElementById('track-artist');
const likeBtn = document.getElementById('like-btn');
const savedListEl = document.getElementById('saved-list');
const logEl = document.getElementById('log');
const scopesInfo = document.getElementById('scopes-info');

/* ====== state ====== */
let accessToken = null;
let tokenScopes = '';
let tokenExpiry = 0;
let currentTrackId = null;
let isLiked = false;
let pollInterval = null;

/* ====== helpers ====== */
function log(...args){
  const t = new Date().toLocaleTimeString();
  logEl.textContent = `[${t}] ${args.join(' ')}\n` + logEl.textContent;
  console.log(...args);
}
function setStatus(s){ statusEl.textContent = 'Statut : ' + s; }
function saveToken(token, expiryMs, scopes){
  accessToken = token;
  tokenExpiry = expiryMs;
  tokenScopes = scopes || '';
  localStorage.setItem('sp_token', token);
  localStorage.setItem('sp_token_expiry', String(expiryMs));
  localStorage.setItem('sp_token_scopes', scopes || '');
  scopesInfo.textContent = 'Scopes: ' + (scopes || '(none)');
}
function loadToken(){
  const t = localStorage.getItem('sp_token');
  const e = Number(localStorage.getItem('sp_token_expiry') || 0);
  const s = localStorage.getItem('sp_token_scopes') || '';
  if (!t || Date.now() > e) {
    clearToken();
    return null;
  }
  accessToken = t; tokenExpiry = e; tokenScopes = s;
  scopesInfo.textContent = 'Scopes: ' + s;
  return t;
}
function clearToken(){
  accessToken = null; tokenExpiry = 0; tokenScopes = '';
  localStorage.removeItem('sp_token'); localStorage.removeItem('sp_token_expiry'); localStorage.removeItem('sp_token_scopes'); 
  scopesInfo.textContent = '';
}

/* ====== PKCE helpers (reuse) ====== */
function generateCodeVerifier(len = 128) {
  const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  let out = '';
  for (let i=0;i<len;i++) out += possible.charAt(Math.floor(Math.random()*possible.length));
  return out;
}
async function generateCodeChallenge(verifier){
  const enc = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  // base64url
  let b = btoa(String.fromCharCode(...new Uint8Array(digest)));
  return b.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

/* ====== Auth (redirect to Spotify) ====== */
authBtn.addEventListener('click', async () => {
  const verifier = generateCodeVerifier(64);
  localStorage.setItem('pkce_verifier', verifier);
  const challenge = await generateCodeChallenge(verifier);
  const params = new URLSearchParams({
    response_type: 'code',
    client_id: CLIENT_ID,
    scope: SCOPES,
    redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256',
    code_challenge: challenge,
    show_dialog: 'true'
  });
  window.location.href = AUTH_ENDPOINT + '?' + params.toString();
});

logoutBtn.addEventListener('click', () => {
  clearToken();
  setStatus('déconnecté');
  updateUIForAuth(false);
});

/* ====== Exchange code -> token (client-side). If CORS blocked, you'll need a proxy) ====== */
async function exchangeCodeForToken(code){
  const verifier = localStorage.getItem('pkce_verifier');
  if (!verifier) { log('PKCE verifier missing'); return null; }
  const body = new URLSearchParams({
    grant_type: 'authorization_code',
    code: code,
    redirect_uri: REDIRECT_URI,
    client_id: CLIENT_ID,
    code_verifier: verifier
  });
  try {
    const resp = await fetch(TOKEN_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    });
    const text = await resp.text();
    log('POST /api/token ->', resp.status, text);
    if (!resp.ok) {
      // error: maybe CORS or invalid
      let parsed;
      try { parsed = JSON.parse(text); } catch(e){ parsed = text; }
      return { error: parsed, status: resp.status };
    }
    const data = JSON.parse(text);
    const expiry = Date.now() + (data.expires_in || 3600)*1000;
    saveToken(data.access_token, expiry, data.scope || '');
    setStatus('connecté');
    updateUIForAuth(true);
    return { data };
  } catch(err){
    log('Exchange failed:', err);
    return { error: String(err) };
  }
}

/* ====== API helpers ====== */
async function api(path, opts = {}){
  const token = accessToken || loadToken();
  if (!token) throw new Error('no token');
  const headers = Object.assign({}, opts.headers || {}, { Authorization: 'Bearer ' + token });
  const res = await fetch('https://api.spotify.com' + path, Object.assign({}, opts, { headers }));
  return res;
}

/* ====== Core: get currently playing, check like, toggle like, list saved ====== */
async function refreshSavedList(){
  try{
    const res = await api('/v1/me/tracks?limit=50');
    if (!res.ok){ log('saved tracks error', res.status); return; }
    const data = await res.json();
    savedListEl.innerHTML = '';
    if (data.items && data.items.length){
      data.items.forEach(it => {
        const tr = it.track;
        const li = document.createElement('li'); li.className='item';
        li.innerHTML = `<img src="${escapeHtml((tr.album.images && tr.album.images[0] && tr.album.images[0].url)||'')}" alt="">
                        <div><div style="font-weight:600">${escapeHtml(tr.name)}</div>
                        <div class="small">${escapeHtml((tr.artists || []).map(a=>a.name).join(', '))}</div></div>`;
        savedListEl.appendChild(li);
      });
    } else {
      savedListEl.innerHTML = '<div class="small">Aucun titre liké (extrait)</div>';
    }
  }catch(e){ log('refreshSavedList error', e); }
}

async function updateCurrentlyPlaying(){
  try{
    const res = await api('/v1/me/player/currently-playing');
    if (res.status === 204 || res.status === 404){
      setStatus('Aucun titre en cours');
      trackArtEl.style.display='none';
      trackTitleEl.textContent = 'Aucun titre';
      trackArtistEl.textContent = '—';
      likeBtn.disabled = true;
      return;
    }
    if (!res.ok){ log('currently-playing error', res.status); return; }
    const data = await res.json();
    if (!data || !data.item) return;
    const tr = data.item;
    // update UI if changed
    if (currentTrackId !== tr.id){
      currentTrackId = tr.id;
      trackArtEl.style.display='block';
      trackArtEl.style.backgroundImage = tr.album && tr.album.images && tr.album.images[0] ? `url(${tr.album.images[0].url})` : 'none';
      trackTitleEl.textContent = tr.name;
      trackArtistEl.textContent = (tr.artists||[]).map(a=>a.name).join(', ');
      likeBtn.disabled = false;
      // check saved status
      await checkIfLiked(currentTrackId);
    }
    setStatus('Synchronisé');
  }catch(e){ log('updateCurrentlyPlaying error', e); if (e.message && e.message.includes('no token')) setStatus('non connecté'); }
}

async function checkIfLiked(trackId){
  try{
    const res = await api(`/v1/me/tracks/contains?ids=${encodeURIComponent(trackId)}`);
    const text = await res.text();
    log('GET contains ->', res.status, text);
    if (!res.ok){
      if (res.status === 401){ setStatus('token invalide'); return; }
      if (res.status === 403){ alert('403: scope manquant (user-library-modify)'); return; }
      isLiked = false; updateLikeUI(); return;
    }
    const arr = JSON.parse(text);
    isLiked = !!arr[0];
    updateLikeUI();
  }catch(e){ log('checkIfLiked error', e); }
}

async function toggleLike(){
  if (!currentTrackId) return;
  likeBtn.disabled = true;
  const method = isLiked ? 'DELETE' : 'PUT';
  try{
    const res = await fetch(`https://api.spotify.com/v1/me/tracks?ids=${encodeURIComponent(currentTrackId)}`, {
      method, headers: { Authorization: 'Bearer ' + (accessToken || loadToken()) }
    });
    log(`${method} /me/tracks ->`, res.status);
    if (res.ok || res.status === 204){
      isLiked = !isLiked;
      updateLikeUI();
      await refreshSavedList();
    } else {
      if (res.status === 401){ alert('401 token invalide, reconnecte-toi'); clearToken(); updateUIForAuth(false); }
      else if (res.status === 403){ alert('403 Forbidden — scope manquant ou compte incorrect'); }
      else { const t = await res.text(); log('toggle error body', t); alert('Erreur API: '+res.status); }
    }
  }catch(e){ log('toggleLike error', e); alert('Erreur réseau'); }
  finally{ likeBtn.disabled = false; }
}

function updateLikeUI(){
  likeBtn.textContent = isLiked ? '❤️' : '🤍';
  likeBtn.title = isLiked ? 'Supprimer des favoris' : 'Ajouter aux favoris';
}

/* ====== helpers UI/auth flow ====== */
function escapeHtml(str){ return String(str||'').replace(/[&<>"'`=\/]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'})[s]); }

function updateUIForAuth(connected){
  if (connected){
    authBtn.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
  } else {
    authBtn.style.display = 'inline-block';
    logoutBtn.style.display = 'none';
    scopesInfo.textContent = '';
  }
}

/* ====== initialisation: handle code param exchange or load token ====== */
async function init(){
  updateUIForAuth(false);
  const stored = loadToken();
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (code && !stored){
    setStatus('Échange du code pour un token...');
    // remove code param for cleanliness
    window.history.replaceState({}, document.title, window.location.pathname);
    const result = await exchangeCodeForToken(code);
    if (result && result.error){
      log('exchange error', result.error);
      // common failure: CORS blocking the POST — instruct user
      if (String(result.error).toLowerCase().includes('failed') || String(result.error).toLowerCase().includes('cors')) {
        alert('Échange code→token bloqué par CORS. Il faut un petit proxy serveur pour faire l’échange. Demande-moi le proxy Node.js si tu veux.');
        setStatus('Erreur d’échange (CORS).');
      } else {
        alert('Échec échange: ' + JSON.stringify(result.error));
        setStatus('Erreur lors de l’échange du token.');
      }
      return;
    }
    // token saved inside exchange function
    updateUIForAuth(true);
  } else if (stored){
    accessToken = stored;
    updateUIForAuth(true);
    setStatus('connecté (token chargé)');
  } else {
    // no token: prompt auth
    setStatus('non connecté — cliquez "Se connecter"');
  }

  if (accessToken){
    // initial population
    await refreshSavedList();
    await updateCurrentlyPlaying();
    // poll
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(updateCurrentlyPlaying, 3000);
  }
}

/* ====== wire like button ====== */
likeBtn.addEventListener('click', toggleLike);

/* ====== export: exchange function used in init ====== */
async function exchangeCodeForToken(code){
  // wrapper to reuse existing function above (we defined earlier)
  return await (async function(codeInner){
    const verifier = localStorage.getItem('pkce_verifier');
    if (!verifier) { log('PKCE verifier missing'); return { error: 'pkce_verifier_missing' }; }
    const body = new URLSearchParams({
      grant_type: 'authorization_code',
      code: codeInner,
      redirect_uri: REDIRECT_URI,
      client_id: CLIENT_ID,
      code_verifier: verifier
    });
    try {
      const resp = await fetch(TOKEN_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      });
      const text = await resp.text();
      log('POST /api/token ->', resp.status, text);
      if (!resp.ok) {
        let parsed;
        try { parsed = JSON.parse(text); } catch(e){ parsed = text; }
        // return error to caller
        return { error: parsed, status: resp.status };
      }
      const data = JSON.parse(text);
      const expiry = Date.now() + (data.expires_in || 3600)*1000;
      saveToken(data.access_token, expiry, data.scope || '');
      setStatus('connecté');
      updateUIForAuth(true);
      return { data };
    } catch(err){
      log('Exchange failed:', err);
      return { error: String(err) };
    }
  })(code);
}

/* ====== start ====== */
init();
</script>
</body>
</html>
