<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Test "J'aime" Spotify — Implicit Grant (tout client)</title>
<style>
  body { font-family: system-ui, -apple-system, Roboto, Arial; padding: 18px; background:#0f1113; color:#eee; }
  label { display:block; margin:8px 0 4px; color:#ccc; }
  input[type="text"] { width:100%; padding:8px; border-radius:6px; border:1px solid #333; background:#121212; color:#eee; }
  button { margin-top:8px; padding:10px 14px; border-radius:8px; border:none; cursor:pointer; background:#1db954; color:#051; font-weight:600; }
  #likeBtn { font-size:22px; padding:8px 12px; background:#222; color:#fff; border:1px solid #444; }
  #log { margin-top:12px; background:#070707; padding:10px; border-radius:6px; height:220px; overflow:auto; font-family:monospace; font-size:13px; color:#9fd; }
  .row { display:flex; gap:10px; align-items:center; margin-top:8px; }
  .small { font-size:0.9rem; color:#9aa; }
  .muted { color:#888; font-size:0.9rem; }
</style>
</head>
<body>
  <h2>Test bouton "J'aime" (client-only, Implicit Grant)</h2>
  <p class="muted">Client ID : <code id="clientIdDisplay"></code></p>

  <div id="authZone" class="row">
    <button id="loginBtn">Se connecter à Spotify</button>
    <button id="logoutBtn" style="background:#444;color:#fff">Se déconnecter</button>
    <div style="margin-left:auto"><span id="authStatus" class="small">Statut : non connecté</span></div>
  </div>

  <label>Track ID (ex. 78FNSZkI1968KTtyf2s315) :</label>
  <input id="trackInput" type="text" placeholder="ID du morceau (track id)" />

  <div class="row">
    <button id="checkBtn">Vérifier (est liké ?)</button>
    <button id="toggleBtn">Basculer like (PUT/DELETE)</button>
    <button id="whoamiBtn">Vérifier token (/me)</button>
    <div style="margin-left:auto"><button id="resetBtn" style="background:#666">Reset</button></div>
  </div>

  <div class="row" style="margin-top:12px">
    <button id="likeBtn">🤍</button>
    <div id="statusText" class="small">Statut : inactif</div>
  </div>

  <div id="log"></div>

<script>
/* ====== CONFIG ====== */
const CLIENT_ID = '91d4165085fd4ed3bd281f16667d64bc';
const REDIRECT_URI = window.location.origin + window.location.pathname; // doit être enregistré EXACTEMENT dans Spotify Dashboard
const SCOPE = 'user-read-private user-read-email user-modify-playback-state user-read-playback-state user-library-read user-library-modify playlist-read-private user-read-recently-played user-read-currently-playing';
const AUTH_ENDPOINT = 'https://accounts.spotify.com/authorize';

document.getElementById('clientIdDisplay').innerText = CLIENT_ID;

/* ====== UTIL ====== */
function log(...args) {
  const time = new Date().toLocaleTimeString();
  const out = `[${time}] ` + args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
  const logEl = document.getElementById('log');
  logEl.innerText = out + '\n' + logEl.innerText;
  console.log(...args);
}

/* ====== AUTH (Implicit Grant) ====== */
function buildImplicitAuthUrl() {
  const params = new URLSearchParams({
    response_type: 'token',
    client_id: CLIENT_ID,
    scope: SCOPE,
    redirect_uri: REDIRECT_URI,
    show_dialog: 'true'
  });
  return AUTH_ENDPOINT + '?' + params.toString();
}

function startImplicitAuth() {
  const url = buildImplicitAuthUrl();
  window.location.href = url;
}

function parseHashForToken() {
  // Exemple de fragment : #access_token=...&token_type=Bearer&expires_in=3600&scope=...
  if (!window.location.hash) return null;
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const access_token = params.get('access_token');
  const expires_in = params.get('expires_in');
  const scope = params.get('scope');
  if (!access_token) return null;
  return { access_token, expires_in: Number(expires_in), scope };
}

function storeToken(tokenObj) {
  // tokenObj = { access_token, expires_in, scope }
  const now = Date.now();
  const expiry = now + (tokenObj.expires_in || 3600) * 1000;
  localStorage.setItem('spotify_access_token', tokenObj.access_token);
  localStorage.setItem('spotify_token_expiry', String(expiry));
  if (tokenObj.scope) localStorage.setItem('spotify_scopes', tokenObj.scope);
}

function clearToken() {
  localStorage.removeItem('spotify_access_token');
  localStorage.removeItem('spotify_token_expiry');
  localStorage.removeItem('spotify_scopes');
  updateAuthUI();
}

function getToken() {
  const token = localStorage.getItem('spotify_access_token');
  const expiry = Number(localStorage.getItem('spotify_token_expiry') || 0);
  if (!token || Date.now() > expiry) {
    // expired
    clearToken();
    return null;
  }
  return token;
}

function updateAuthUI() {
  const token = getToken();
  const status = document.getElementById('authStatus');
  if (token) {
    status.innerText = 'Statut : connecté';
    status.style.color = '#8f8';
  } else {
    status.innerText = 'Statut : non connecté';
    status.style.color = '#f88';
  }
  log('Scopes (stockés):', localStorage.getItem('spotify_scopes') || '(aucun)');
}

/* ====== Spotify API helpers ====== */
async function apiFetch(path, opts = {}) {
  const token = getToken();
  if (!token) throw new Error('No access token. Connecte-toi d\'abord.');
  const headers = Object.assign({}, opts.headers || {}, { Authorization: 'Bearer ' + token });
  const response = await fetch('https://api.spotify.com' + path, Object.assign({}, opts, { headers }));
  return response;
}

/* ====== Actions: whoami, check, toggle ====== */
async function whoami() {
  try {
    const r = await apiFetch('/v1/me');
    const text = await r.text();
    log('/me ->', r.status, text);
    if (r.ok) document.getElementById('statusText').innerText = 'Statut : token valide (GET /me ok)';
    else {
      document.getElementById('statusText').innerText = 'Statut : /me -> ' + r.status;
      if (r.status === 401) alert('Token invalide/expiré. Reconnecte-toi.');
    }
  } catch (err) {
    log('whoami error', err);
    alert('Erreur réseau / token absent.');
  }
}

async function checkIfTrackIsLiked() {
  const trackId = document.getElementById('trackInput').value.trim();
  if (!trackId) { alert('Saisis un track id'); return; }
  try {
    const r = await apiFetch(`/v1/me/tracks/contains?ids=${encodeURIComponent(trackId)}`);
    const text = await r.text();
    log('GET contains ->', r.status, text);
    if (!r.ok) {
      document.getElementById('statusText').innerText = 'Statut : erreur ' + r.status;
      if (r.status === 403) {
        alert('403 Forbidden — scope manquant ou compte incorrect. Vérifie que tu as accepté user-library-modify.');
      }
      return;
    }
    const arr = JSON.parse(text);
    const isLiked = !!arr[0];
    const likeBtn = document.getElementById('likeBtn');
    likeBtn.innerText = isLiked ? '❤️' : '🤍';
    likeBtn.dataset.liked = String(isLiked);
    document.getElementById('statusText').innerText = 'Statut : ' + (isLiked ? 'Déjà liké' : 'Pas liké');
    log('isLiked =', isLiked);
  } catch (err) {
    log('checkIfTrackIsLiked error', err);
    alert('Erreur réseau / token invalide.');
  }
}

async function toggleLike() {
  const trackId = document.getElementById('trackInput').value.trim();
  if (!trackId) { alert('Saisis un track id'); return; }
  const likeBtn = document.getElementById('likeBtn');
  const currently = likeBtn.dataset.liked === 'true';
  const method = currently ? 'DELETE' : 'PUT';
  document.getElementById('statusText').innerText = `Statut : envoi ${method}...`;
  try {
    const r = await apiFetch(`/v1/me/tracks?ids=${encodeURIComponent(trackId)}`, { method });
    const body = await r.text();
    log(`${method} /me/tracks ->`, r.status, body || '(no body)');
    if (!r.ok) {
      if (r.status === 401) { alert('401 token invalide/expiré — reconnecte-toi.'); clearToken(); updateAuthUI(); return; }
      if (r.status === 403) {
        alert('403 Forbidden — vérifie que le token contient user-library-modify et que tu es connecté au bon compte.');
        return;
      }
      document.getElementById('statusText').innerText = 'Statut : erreur ' + r.status;
      return;
    }
    const newState = !currently;
    likeBtn.innerText = newState ? '❤️' : '🤍';
    likeBtn.dataset.liked = String(newState);
    document.getElementById('statusText').innerText = 'Statut : ' + (newState ? 'Liké' : 'Non liké');
    await checkIfTrackIsLiked();
  } catch (err) {
    log('toggleLike error', err);
    alert('Erreur réseau / token absent.');
  }
}

/* ====== Wiring UI ====== */
document.getElementById('loginBtn').addEventListener('click', startImplicitAuth);
document.getElementById('logoutBtn').addEventListener('click', () => { clearToken(); updateAuthUI(); });
document.getElementById('whoamiBtn').addEventListener('click', whoami);
document.getElementById('checkBtn').addEventListener('click', checkIfTrackIsLiked);
document.getElementById('toggleBtn').addEventListener('click', toggleLike);
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('trackInput').value = '';
  document.getElementById('likeBtn').innerText = '🤍';
  delete document.getElementById('likeBtn').dataset.liked;
  document.getElementById('statusText').innerText = 'Statut : inactif';
  log('Reset UI');
});
document.getElementById('likeBtn').addEventListener('click', toggleLike);

/* ====== On load: parse token if present in URL #hash ====== */
(function init() {
  // If the redirect back from Spotify contains the token in the hash, parse and store it
  const tokenObj = parseHashForToken();
  if (tokenObj) {
    // store and clear fragment
    storeToken(tokenObj);
    // remove fragment from URL for cleanliness
    window.history.replaceState({}, document.title, REDIRECT_URI);
  }
  updateAuthUI();
  // If token present, optionally auto-fill an example track
  // document.getElementById('trackInput').value = '78FNSZkI1968KTtyf2s315';
})();
</script>
</body>
</html>
